  # ─────────────────────────────────────────
  # ПАНЕЛЬ МОНИТОРИНГА
  # ─────────────────────────────────────────

  /dashboard:
    get:
      summary: Получить сводку аккаунта
      operationId: get-dashboard
      tags: [Панель мониторинга]
      description: |
        Баланс, замороженные средства, активные кампании и потребление за период.

        Период задаётся параметрами `from` и `to`; по умолчанию — последние 30 дней,
        максимум — 366 дней.

        #### Что изменилось в 1.13
        Ответ переписан. Прежняя версия отдавала `week_activity` (7 дней) и `full_activity`
        (за всё время) и считала их прямым перебором таблицы звонков: у крупного аккаунта
        запрос шёл около 24 секунд. Теперь данные приходят из суточной витрины, ответ —
        единицы миллисекунд, а период задаёт клиент.

        | Было | Стало |
        |------|-------|
        | `running&awaiting` | `campaigns.active` |
        | `in_queue` | `campaigns.in_queue` |
        | `week_activity` (7 дней) | `daily` (любой период) |
        | `full_activity` (за всё время) | `totals` + `reasons` за период |
        | `success` + `recalled` раздельно | `calls_answered` одной величиной |

        ⚠️ Статистика доступна с **23 мая 2026** — за более ранние даты витрина пуста.
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
        - name: from
          in: query
          required: false
          description: Начало периода, `YYYY-MM-DD`. По умолчанию — 29 дней назад.
          schema: { type: string, format: date }
          example: "2026-08-01"
        - name: to
          in: query
          required: false
          description: Конец периода, `YYYY-MM-DD`. По умолчанию — сегодня.
          schema: { type: string, format: date }
          example: "2026-08-22"
      responses:
        '200':
          description: Сводка аккаунта за период.
          content:
            application/json:
              schema:
                type: object
                required: [balance, currency, reserved, campaigns, period, totals, reasons, daily]
                properties:
                  balance:
                    type: number
                    description: Текущий баланс
                  currency:
                    type: string
                    description: Символ валюты
                  reserved:
                    type: number
                    description: Заморожено под активными обзвонами и рассылками; возвращается по их завершении
                  campaigns:
                    type: object
                    properties:
                      active:
                        type: integer
                        description: Обзвонов в работе (running, awaiting, moderation, generating)
                      in_queue:
                        type: integer
                        description: Номеров в очереди на звонок в этих обзвонах
                  period:
                    type: object
                    properties:
                      from: { type: string, format: date }
                      to: { type: string, format: date }
                  totals:
                    $ref: '#/components/schemas/DashboardTotals'
                  reasons:
                    $ref: '#/components/schemas/DashboardReasons'
                  daily:
                    type: array
                    description: Разбивка потребления по дням, включая дни без активности.
                    items:
                      $ref: '#/components/schemas/DashboardDay'
              example:
                balance: 158516.20
                currency: "₸"
                reserved: 0
                campaigns:
                  active: 2
                  in_queue: 1450
                period:
                  from: "2026-07-24"
                  to: "2026-08-22"
                totals:
                  calls_total: 831199
                  calls_answered: 289167
                  answer_rate: 34.8
                  call_seconds: 2953661
                  agent_seconds: 0
                  records: 0
                  sms_count: 31
                  synthesis_count: 0
                  recognition_count: 0
                  flash_count: 0
                reasons:
                  busy: 167484
                  no_answer: 342532
                  error: 26749
                  spam: 3570
                daily:
                  - date: "2026-08-21"
                    calls_total: 41230
                    calls_answered: 14884
                    call_seconds: 146112
                    agent_seconds: 0
                    records: 0
                    sms_count: 0
                    synthesis_count: 0
                    recognition_count: 0
                    flash_count: 0
        '401': { $ref: '#/components/responses/401' }
        '422': { $ref: '#/components/responses/422' }
        '429': { $ref: '#/components/responses/429' }

  # ─────────────────────────────────────────
  # УВЕДОМЛЕНИЯ
  # ─────────────────────────────────────────

  /notifications:
    get:
      summary: Получить уведомления
      operationId: get-notifications
      tags: [Уведомления]
      description: |
        Возвращает все уведомления аккаунта.

        #### Типы уведомлений
        | Тип | Описание |
        |-----|----------|
        | `SoundConfirmed` | Аудиозапись прошла/не прошла модерацию |
        | `SoundCommented` | Комментарий к аудиозаписи |
        | `SMSBulkConfirmed` | Рассылка прошла/не прошла модерацию |
        | `SMSBulkCommented` | Комментарий к рассылке |
        | `SMSBulkFinished` | Рассылка завершена |
        | `ScenarioConfirmed` | Сценарий прошёл модерацию |
        | `ScenarioCommented` | Комментарий к сценарию |
        | `AutocallConfirmed` | Обзвон прошёл/не прошёл модерацию |
        | `AutocallCommented` | Комментарий к обзвону |
        | `AutocallFinished` | Обзвон завершён |
        | `ImportComplete` | Импорт списка завершён |
        | `ImportFailure` | Ошибка импорта |
        | `NonexistentContactsDetected` | В списке обнаружены несуществующие номера |
        | `ExportIsReady` | Экспорт готов к скачиванию |
        | `ExportFailure` | Ошибка экспорта |
        | `RefreshBalance` | Изменение баланса |
        | `LowBalance` | Баланс опустился ниже установленного порога |
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      responses:
        '200':
          description: Объект с уведомлениями и счётчиком непрочитанных.
          content:
            application/json:
              schema:
                type: object
                required: [data, unread]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
                  unread:
                    type: integer
                    description: Количество непрочитанных уведомлений
              example:
                data:
                  - id: "4f227359-cbc5-4b4d-811f-e8846abe6f35"
                    type: "AutocallFinished"
                    data:
                      id: 42
                      name: "Акция ноябрь"
                    read_at: null
                    created_at: "2024-11-01 10:35:00"
                    updated_at: "2024-11-01 10:35:00"
                  - id: "2c2f0bac-3e80-4504-82e5-6b41d17cfbd3"
                    type: "LowBalance"
                    data:
                      balance: 45.20
                      threshold: 100.00
                    read_at: null
                    created_at: "2024-11-01 11:00:00"
                    updated_at: "2024-11-01 11:00:00"
                unread: 2
        '401': { $ref: '#/components/responses/401' }
        '429': { $ref: '#/components/responses/429' }

  /notifications/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: ID уведомления (UUID)
    put:
      summary: Отметить уведомление прочитанным
      operationId: put-notifications-id
      tags: [Уведомления]
      description: Помечает уведомление как прочитанное.
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      responses:
        '200':
          description: ID и дата прочтения уведомления.
          content:
            application/json:
              schema:
                type: object
                required: [id, read_at]
                properties:
                  id: { type: string }
                  read_at: { type: string }
              example:
                id: "2c2f0bac-3e80-4504-82e5-6b41d17cfbd3"
                read_at: "2024-11-01 12:00:00"
        '401': { $ref: '#/components/responses/401' }
        '404': { $ref: '#/components/responses/404' }
        '429': { $ref: '#/components/responses/429' }
    delete:
      summary: Удалить уведомление
      operationId: delete-notifications-id
      tags: [Уведомления]
      description: Удаляет уведомление.
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      responses:
        '204':
          description: Уведомление удалено.
        '401': { $ref: '#/components/responses/401' }
        '404': { $ref: '#/components/responses/404' }
        '429': { $ref: '#/components/responses/429' }
        '500': { $ref: '#/components/responses/500' }

  # ─────────────────────────────────────────
  # CALLER IDs (аренда номеров)
  # ─────────────────────────────────────────

  /caller-ids:
    get:
      operationId: get-caller-ids
      tags: [Номерной пул]
      summary: Список арендованных номеров
      description: Возвращает список номеров, арендованных текущим пользователем, а также лимиты тарифа.
      parameters:
        - $ref: '#/components/parameters/Accept'
      responses:
        '200':
          description: Список арендованных номеров.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        provider: { type: string, example: tele2 }
                        number: { type: string, example: "+77086469620" }
                        rented_until: { type: string, format: date-time }
                  max_caller_id_rentals: { type: integer, description: Максимальное количество арендованных номеров по тарифу }
                  caller_id_rent_price: { type: number, description: Стоимость аренды одного номера в тенге/мес }
        '401': { $ref: '#/components/responses/401' }

    post:
      operationId: post-caller-ids
      tags: [Номерной пул]
      summary: Арендовать номер
      description: |
        Арендует выбранный номер из пула на 1 месяц. Со счёта списывается стоимость аренды согласно тарифу.
        Перед арендой получите список доступных номеров через `GET /caller-ids/available` (веб-интерфейс)
        или выберите ID из числа свободных.

        **Лимиты:** Bronze — 0 номеров, Silver — 1, Gold — 2.
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [caller_id_id]
              properties:
                caller_id_id:
                  type: integer
                  description: ID записи из таблицы sip_caller_ids (свободного номера).
            example:
              caller_id_id: 42
      responses:
        '201':
          description: Номер успешно арендован.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  number: { type: string, example: "+77086469620" }
                  rented_until: { type: string, format: date-time }
        '402':
          description: Недостаточно средств на балансе.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorMessage' }
        '403':
          description: Тариф не поддерживает аренду или достигнут лимит.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorMessage' }
        '409':
          description: Выбранный номер уже занят другим пользователем.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorMessage' }
        '422': { $ref: '#/components/responses/422' }
        '401': { $ref: '#/components/responses/401' }

  /caller-ids/{id}:
    delete:
      operationId: delete-caller-ids-id
      tags: [Номерной пул]
      summary: Освободить номер досрочно
      description: Досрочно освобождает арендованный номер. **Средства не возвращаются.**
      parameters:
        - $ref: '#/components/parameters/Accept'
        - name: id
          in: path
          required: true
          schema: { type: integer }
          description: ID записи арендованного номера.
      responses:
        '200':
          description: Номер успешно освобождён.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '404':
          description: Номер не найден или не принадлежит вам.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorMessage' }
        '401': { $ref: '#/components/responses/401' }

  # ─────────────────────────────────────────
  # FLASH CALLS
  # ─────────────────────────────────────────

  /flash-calls:
    post:
      summary: Отправить Flash Call
      operationId: post-flash-calls
      tags: [Flash Calls]
      deprecated: true
      description: |
        > ⚠️ **Прекращается с 1 ноября 2026 года.** Согласно п. 3-1 ст. 21 Закона РК «О связи»
        > (в редакции Закона от 19.06.2026 № 320-VIII) с 20 августа 2026 года операторам связи запрещено
        > пропускать автоматические вызовы для передачи кодов идентификации и аутентификации, в том числе
        > прерывающиеся до или после первого гудка. Переведите подтверждение номера на SMS.

        Совершает Flash Call на указанный номер. Последние N цифр номера звонящего — это код подтверждения.
        Звонок автоматически сбрасывается, биллинг на стороне абонента не возникает.

        **Авто-код** (`digits`): сервис сам генерирует случайный код. Работает всегда.
        **Свой код** (`code`): вы передаёте нужный код. Может вернуть 422 если номер с нужными последними цифрами недоступен.

        > Рекомендуется использовать Авто-код для гарантированной доставки.

        **Rate limit:** не более 3 попыток на один номер в течение 5 минут.

        **Статус доставки.** Ответ `201` значит «принят в набор» (`status: queued`), а не «доставлен».
        Итог — `GET /flash-calls/{id}` или вебхук на `callback_url` (свой в запросе или глобальный
        из настроек). Статусы:

        | status | значение |
        |---|---|
        | `queued` | ждёт набора |
        | `dialing` | набираем |
        | `delivered` | звонок дошёл до телефона: не ответили, сбросили, занято или ответили |
        | `failed` | сеть не дотянулась до абонента (перегрузка, сбой, номер недоступен) — после одного автоматического повтора |
        | `expired` | не набран за 2 минуты с момента запроса — код уже бесполезен |

        В `reason` — исход звонка от сети (`NO ANSWER`, `BUSY`, `CONGESTION`…).
        Списание — при `201`, независимо от итога.

        **`503`** — сейчас нет связи для Flash Call. Деньги не списаны, в rate limit попытка не
        засчитана: отправьте код другим способом или повторите позже.
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      requestBody:
        required: true
        description: |
          Для **Авто-кода** отправьте `number` + `digits`.
          Для **Своего кода** отправьте `number` + `code`.
        content:
          application/json:
            schema:
              type: object
              required: [number]
              properties:
                number:
                  type: string
                  minLength: 12
                  maxLength: 12
                  pattern: '^\+7(700|701|702|705|706|707|708|747|771|775|776|777|778|710|711|712|713|714|715|716|717|718|721|722|723|724|725|726|727|728|729|736)\d{7}$'
                  example: "+77000000000"
                  description: Номер получателя в формате +7XXXXXXXXXX
                digits:
                  type: integer
                  minimum: 3
                  maximum: 6
                  description: |
                    **Авто-код**: количество цифр кода (3–6).
                    Обязательно если `code` не передан.
                code:
                  type: string
                  pattern: '^\d{3,6}$'
                  minLength: 3
                  maxLength: 6
                  example: "1234"
                  description: |
                    **Свой код**: числовой код от 3 до 6 цифр.
                    Обязательно если `digits` не передан.
                callback_url:
                  type: string
                  maxLength: 256
                  example: "https://example.com/flash-status"
                  description: |
                    Вебхук со статусом этого Flash Call. Не передан — используется глобальный
                    адрес из настроек.
            examples:
              Авто-код из 4 цифр:
                value:
                  number: "+77010000000"
                  digits: 4
              Свой код:
                value:
                  number: "+77010000000"
                  code: "7823"
              С вебхуком:
                value:
                  number: "+77010000000"
                  digits: 4
                  callback_url: "https://example.com/flash-status"
      responses:
        '201':
          description: Flash Call принят в набор. Код подтверждения — последние N цифр поля `code`.
          content:
            application/json:
              schema:
                type: object
                required: [id, code, number, status]
                properties:
                  id:
                    type: integer
                    description: ID Flash Call записи — для `GET /flash-calls/{id}`
                  code:
                    type: string
                    description: Код подтверждения (последние N цифр номера звонящего)
                  number:
                    type: string
                    description: Номер получателя
                  status:
                    type: string
                    enum: [queued]
                    description: Всегда `queued` — итог придёт позже
              example:
                id: 1023
                code: "7482"
                number: "+77010000000"
                status: queued
        '401': { $ref: '#/components/responses/401' }
        '402':
          description: Недостаточно средств на балансе.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorMessage' }
        '422':
          description: |
            Ошибка валидации: неверно заполнены поля, либо (для режима Свой код) номер с нужными цифрами недоступен.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
        '429':
          description: Превышен rate limit — не более 3 попыток на один номер в течение 5 минут.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorMessage' }
        '503':
          description: |
            Сейчас нет связи для Flash Call. Деньги не списаны, попытка в rate limit не засчитана.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorMessage' }
              example:
                message: "Сервис Flash Call временно недоступен. Попробуйте позже."

  /flash-calls/{id}:
    get:
      summary: Статус Flash Call
      operationId: get-flash-call
      tags: [Flash Calls]
      description: |
        > ⚠️ Отправка Flash Call прекращается с 1 ноября 2026 года (п. 3-1 ст. 21 Закона РК «О связи»).
        > Статусы уже отправленных звонков остаются доступны.

        Текущий статус Flash Call. Окончательные статусы — `delivered`, `failed`, `expired`;
        обычно итог известен через 15–30 секунд после `POST`. Опрашивайте не чаще раза в
        2–3 секунды или используйте вебхук (`callback_url`) — он придёт с тем же телом.

        У Flash Call, отправленных до 01.10.2026, `status` = `null`: статусов тогда не было.
      parameters:
        - $ref: '#/components/parameters/Accept'
        - name: id
          in: path
          required: true
          schema: { type: integer }
          description: ID из ответа `POST /flash-calls`
      responses:
        '200':
          description: Flash Call
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlashCall' }
              example:
                id: 1023
                number: "+77010000000"
                code: "7482"
                type: auto
                status: delivered
                reason: "NO ANSWER"
                attempts: 1
                cost: 6
                created_at: "2026-10-01 12:00:00"
                finished_at: "2026-10-01 12:00:16"
        '401': { $ref: '#/components/responses/401' }
        '404':
          description: Flash Call не найден (или принадлежит другому аккаунту).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorMessage' }

# ─────────────────────────────────────────
# КОМПОНЕНТЫ
# ─────────────────────────────────────────

  /tariffs:
    servers:
      - url: https://autocall.kz/api/public
    get:
      operationId: getTariffs
      summary: Получить актуальные тарифы
      tags: [Публичный API]
      security: []
      description: Возвращает список тарифных планов с ценами на звонки, SMS и синтез речи. Данные кешируются на 1 час.
      responses:
        "200":
          description: Список тарифов
          content:
            application/json:
              schema:
                type: object
                properties:
                  currency:
                    type: string
                    example: KZT
                  note:
                    type: string
                  tariffs:
                    type: array
                    items:
                      $ref: "#/components/schemas/Tariff"
              example:
                currency: KZT
                note: "Цены за единицу: звонок (секунда тарификации), SMS (1 сообщение)."
                tariffs:
                  - name: BRONZE
                    threshold: 0
                    call_price: 3.5
                    sms_price: 18
                    synthesis_price: 2
                    speech_price: 2
                    recording_price: 1
                  - name: SILVER
                    threshold: 50000
                    call_price: 2.8
                    sms_price: 16
                    synthesis_price: 1.8
                    speech_price: 1.8
                    recording_price: 0.8
                  - name: GOLD
                    threshold: 200000
                    call_price: 2.2
                    sms_price: 14
                    synthesis_price: 1.5
                    speech_price: 1.5
                    recording_price: 0.5

  /test-call:
    servers:
      - url: https://autocall.kz/api/public
    post:
      operationId: sendTestCall
      summary: Отправить тестовый звонок
      tags: [Публичный API]
      security: []
      description: |
        Инициирует реальный тестовый звонок от AutoCall.kz на указанный казахстанский номер телефона.

        Ограничения:
        - Один звонок на номер в сутки
        - Доступно с 09:00 до 21:30 по Алматы (UTC+6)
        - Только казахстанские мобильные номера (7xxxxxxxxxx)
        - Rate limit: 2 запроса в минуту с одного IP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
              properties:
                phone:
                  type: string
                  description: Казахстанский мобильный номер без +7, только цифры после 7
                  pattern: "^(700|701|702|705|706|707|708|747|771|775|776|777|778|710|711|712|713|714|715|716|717|718|721|722|723|724|725|726|727|728|729|736)\\d{7}$"
                  example: "7771234567"
            example:
              phone: "7771234567"
      responses:
        "200":
          description: Звонок успешно инициирован
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  number:
                    type: string
              example:
                message: "Тестовый звонок отправлен на номер +77000000000. Ожидайте звонка в течение 1–2 минут."
                number: "+77000000000"
        "422":
          description: Валидация не прошла или звонки недоступны сейчас
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "429":
          description: Номер уже получил тестовый звонок сегодня или превышен rate limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "403":
          description: Номер в чёрном списке или запрос заблокирован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  # ─────────────────────────────────────────
  # СПИСКИ КОНТАКТОВ
  # ─────────────────────────────────────────

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Заголовок: Authorization: Bearer ВАШ_API_КЛЮЧ'

  parameters:
    ContentType:
      name: Content-Type
      in: header
      required: true
      schema:
        type: string
        default: application/json
      description: Тип содержимого запроса
    Accept:
      name: Accept
      in: header
      required: true
      schema:
        type: string
        default: application/json
      description: Тип содержимого ответа
    DateFrom:
      name: date_from
      in: query
      required: false
      schema:
        type: string
        example: "2024-01-01"
      description: "Фильтр: с какой даты (формат Y-m-d)"
    DateTo:
      name: date_to
      in: query
      required: false
      schema:
        type: string
        example: "2024-12-31"
      description: "Фильтр: по какую дату (формат Y-m-d)"
    Order:
      name: order
      in: query
      required: false
      schema:
        type: string
        enum: [asc, desc]
      description: Сортировка по дате создания
    ClientIdFilter:
      name: client_id
      in: query
      required: false
      schema:
        type: string
      description: Фильтр по client_id из Вашей системы
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
      description: Номер страницы

  responses:
    '401':
      description: Не передан или недействителен API ключ.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorMessage' }
          example:
            message: "Unauthenticated."
    '403':
      description: |
        Запрос отклонён. Различить причину можно по полю `reason`:

        - `sms_not_verified` — номер телефона аккаунта не подтверждён;
        - `account_blocked` — аккаунт заблокирован (чаще всего отрицательный баланс);
        - `api_key_scope` — этому API-ключу не разрешён вызванный метод (права ключа задаются
          в разделе **API** личного кабинета);
        - `api_key_ip` — запрос пришёл с адреса, которого нет в списке разрешённых IP ключа.

        Ключ при этом действителен: повторять запрос имеет смысл после устранения причины.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorMessage' }
          example:
            message: "Аккаунт заблокирован. Возможные причины: отрицательный баланс, нарушение пользовательского соглашения, подозрение на взлом. Пополните баланс или обратитесь в поддержку."
            reason: "account_blocked"
    '404':
      description: Ресурс не найден по указанному ID.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorMessage' }
          example:
            message: "Not found."
    '422':
      description: Ошибка валидации — данные запроса не прошли проверку.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
          example:
            message: "The given data was invalid."
            errors:
              name: ["Поле name обязательно."]
    '429':
      description: |
        Превышен лимит запросов — либо 300 в минуту на ключ, либо 15 в секунду на IP-адрес.
        Тело показано для лимита приложения; серверный лимит отдаёт HTML.
        Повторяйте запрос с нарастающей паузой, а не сразу.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorMessage' }
          example:
            message: "Too Many Attempts."
    '500':
      description: Внутренняя ошибка сервера.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorMessage' }
          example:
            message: "Server Error."

  schemas:

    ErrorMessage:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Описание ошибки

    FlashCall:
      type: object
      description: 'Flash Call — тело `GET /flash-calls/{id}` и вебхука `{"flash_call": {...}}`.'
      properties:
        id: { type: integer }
        number: { type: string, description: Номер получателя }
        code: { type: string, description: Код подтверждения }
        type: { type: string, enum: [auto, own], description: "`auto` — код по `digits`, `own` — свой `code`" }
        status:
          type: [string, "null"]
          enum: [queued, dialing, delivered, failed, expired, null]
          description: |
            `delivered` — звонок дошёл до телефона (не ответили, сбросили, занято или ответили);
            `failed` — сеть не дотянулась до абонента, после одного автоматического повтора;
            `expired` — не набран за 2 минуты. `null` — Flash Call отправлен до появления статусов.
        reason:
          type: [string, "null"]
          description: Исход звонка от сети (`NO ANSWER`, `BUSY`, `ANSWERED`, `CONGESTION`, `FAILED`…)
        attempts: { type: integer, description: Сколько раз набирали (0–2) }
        cost: { type: [number, "null"], description: Списано за этот Flash Call, ₸ }
        created_at: { type: string, example: "2026-10-01 12:00:00" }
        finished_at: { type: [string, "null"], example: "2026-10-01 12:00:16", description: Когда статус стал окончательным }

    ValidationError:
      type: object
      required: [message, errors]
      properties:
        message:
          type: string
          description: Общее описание ошибки
        errors:
          type: object
          description: Объект с ошибками по каждому полю
          additionalProperties:
            type: array
            items:
              type: string

    Tariff:
      type: object
      properties:
        name:
          type: string
          enum: [BRONZE, SILVER, GOLD]
          description: Название тарифного плана
        threshold:
          type: integer
          description: Минимальный баланс для активации тарифа (тенге)
        call_price:
          type: number
          description: Цена за секунду исходящего звонка (тенге)
        sms_price:
          type: number
          description: Цена за одно SMS-сообщение (тенге)
        synthesis_price:
          type: number
          description: Цена за секунду синтеза речи (тенге)
        speech_price:
          type: number
          description: Цена за секунду распознавания речи (тенге)
        recording_price:
          type: number
          description: Цена за секунду записи звонка (тенге)

    Pagination:
      type: object
      description: Стандартный объект постраничного вывода Laravel
      required: [current_page, data, first_page_url, from, last_page, last_page_url, next_page_url, path, per_page, prev_page_url, to, total]
      properties:
        current_page: { type: integer }
        data:
          type: array
          items: {}
        first_page_url: { type: string }
        from: { type: integer }
        last_page: { type: integer }
        last_page_url: { type: string }
        next_page_url: { type: [string, "null"] }
        path: { type: string }
        per_page: { type: integer }
        prev_page_url: { type: [string, "null"] }
        to: { type: integer }
        total: { type: integer }

    DashboardTotals:
      type: object
      description: Потребление за период. Источник — суточная витрина, те же цифры, что в личном кабинете.
      properties:
        calls_total: { type: integer, description: Набрано номеров (без тестовых обзвонов) }
        calls_answered: { type: integer, description: "Состоявшихся контактов: взяли трубку либо перезвонили сами" }
        answer_rate:
          type: [number, "null"]
          description: Доля дозвона в процентах. `null`, если звонков не было — ноль читался бы как «звонили и не дозвонились».
        call_seconds: { type: integer, description: Секунд разговора, включая перезвоны абонентов }
        agent_seconds: { type: integer, description: Из них секунд разговора с ИИ-агентом }
        records: { type: integer, description: Записей разговоров }
        sms_count:
          type: integer
          description: SMS в тарифицируемых СЕГМЕНТАХ — длинное сообщение режется на несколько и столько же раз оплачивается.
        synthesis_count: { type: integer, description: Синтезов речи }
        recognition_count: { type: integer, description: Распознаваний речи }
        flash_count: { type: integer, description: Flash Call }

    DashboardReasons:
      type: object
      description: Почему не дозвонились. Сумма причин равна `calls_total − calls_answered`.
      properties:
        busy: { type: integer, description: Занято }
        no_answer: { type: integer, description: Не отвечает }
        error: { type: integer, description: Номер недоступен или не существует }
        spam: { type: integer, description: Абонент пожаловался на спам }

    DashboardDay:
      type: object
      description: Потребление за один день. Дни без активности присутствуют с нулями.
      properties:
        date: { type: string, format: date }
        calls_total: { type: integer }
        calls_answered: { type: integer }
        call_seconds: { type: integer }
        agent_seconds: { type: integer }
        own_pbx_seconds:
          type: integer
          description: Из `call_seconds` — секунды разговоров через вашу собственную АТС (раздел «Мои АТС»). Остальное прошло через связь AutoCall.kz.
        records: { type: integer }
        sms_count: { type: integer }
        synthesis_count: { type: integer }
        recognition_count: { type: integer }
        flash_count: { type: integer }

    Contact:
      type: object
      required: [id, number, extra, variables, created_at, updated_at]
      properties:
        id: { type: integer }
        list_id: { type: integer }
        number: { type: string }
        extra: { type: [string, "null"], description: Дополнительное описание (ФИО и т.п.) }
        variables:
          type: [object, "null"]
          description: |
            Переменные контакта для персонализации SMS. Используются в шаблонах через `{{varname}}`.
            Ключи — только латиница, цифры и `_` (до 30 символов). Значения — строки до 255 символов.
          example: { name: "Иванов Иван", debt: "15000", contract: "№123" }
          additionalProperties: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ContactList:
      type: object
      required: [id, client_id, name, importing, nonexistent, created_at, updated_at, contacts_count, used]
      properties:
        id: { type: integer }
        client_id: { type: [string, "null"] }
        name: { type: string }
        importing: { type: boolean, description: Идёт ли импорт прямо сейчас }
        nonexistent:
          type: [array, "null"]
          description: Массив ID контактов с несуществующими номерами
          items: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        contacts_count: { type: integer }
        used: { type: integer, description: Сколько раз список использовался }

    Sound:
      type: object
      required: [id, client_id, name, duration, confirmed, comment, confirmed_at, created_at, updated_at, playback_url, used]
      properties:
        id: { type: integer }
        client_id: { type: [string, "null"] }
        name: { type: string }
        duration: { type: integer, description: Длительность в секундах }
        confirmed: { type: boolean, description: Одобрена ли модераторами }
        comment: { type: [string, "null"], description: Комментарий модератора }
        confirmed_at: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        playback_url: { type: string, description: URL для прослушивания/скачивания }
        used: { type: integer, description: Количество использований в обзвонах }

    Scenario:
      type: object
      required: [id, client_id, name, max_cost, comment, created_at, updated_at, used]
      properties:
        id: { type: integer }
        client_id: { type: [string, "null"] }
        name: { type: string }
        max_cost: { type: [string, number], description: Максимальная стоимость на 1 звонок }
        comment: { type: [string, "null"] }
        confirmed_at: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        used: { type: integer }

    ScenarioDetail:
      allOf:
        - $ref: '#/components/schemas/Scenario'
        - type: object
          properties:
            data:
              type: object
              description: |
                Граф сценария — здесь **объектом**, а не строкой (в отличие от `data` при
                создании/редактировании). Ключи = id элементов. Структура — в описании раздела.

    Voice:
      type: object
      properties:
        name: { type: string, description: "Значение для поля `voice` при создании агента", example: Sulafat }
        display: { type: string, description: Как голос называется в личном кабинете, example: Асель }
        gender: { type: string, enum: [male, female] }
        characteristic: { type: [string, "null"], description: Краткое описание тембра/манеры }
        sample: { type: string, description: Ссылка на аудиофрагмент голоса }
        avatar: { type: string, description: Ссылка на аватар голоса }
        has_avatar: { type: boolean }

    AgentDataField:
      type: object
      required: [key]
      properties:
        key:
          type: string
          maxLength: 40
          description: |
            Идентификатор поля — только латиница, цифры и `_`. Под этим именем значение
            попадёт в результат звонка.
          example: confirmed
        label:
          type: string
          maxLength: 100
          description: Человеческое название колонки в отчёте. Не передали — возьмём `key`.
          example: Подтвердил приём

    AgentTool:
      type: object
      required: [type, name]
      description: |
        Действие, которое агент может выполнить прямо во время разговора.
        Решение о вызове принимает сам агент — по полю `when`.
      properties:
        type:
          type: string
          enum: [sms, http, transfer]
          description: |
            `sms` — отправить сообщение абоненту, `http` — запрос на ваш сервер,
            `transfer` — соединить абонента с внутренним номером вашей АТС или с одним из ваших
            подтверждённых номеров (см. `target`).

            Действий каждого типа может быть сколько угодно: несколько шаблонов SMS, несколько
            запросов, несколько целей перевода.
        name:
          type: string
          maxLength: 30
          description: Короткое имя действия — латиница, цифры и `_`.
          example: price
        when:
          type: string
          maxLength: 200
          description: В какой момент разговора это нужно сделать.
          example: клиент попросил прислать прайс
        text:
          type: string
          maxLength: 500
          description: |
            Только для `type=sms`. Текст сообщения — уходит абоненту буквально, агент его
            не переписывает. Оплачивается по вашему тарифу SMS.
        method:
          type: string
          enum: [GET, POST, PUT, PATCH, DELETE]
          default: GET
          description: Только для `type=http`.
        url:
          type: string
          maxLength: 500
          description: |
            Только для `type=http`. Адрес вашего сервера. Поддерживает подстановки
            `{{phone}}`, `{{name}}` и другие переменные контакта.

            Запросы во внутренние и приватные сети запрещены — только публичные адреса.
        label:
          type: string
          maxLength: 60
          description: |
            Только для `type=transfer`. Как агент назовёт цель вслух: «с менеджером»,
            «с отделом продаж». Именно это он произнесёт перед соединением.
          example: с менеджером
        target:
          type: string
          enum: [extension, number]
          default: extension
          description: |
            Только для `type=transfer`. Куда соединять:

            - `extension` — внутренний номер вашей АТС, указывается в `ext`;
            - `number` — один из ВАШИХ ПОДТВЕРЖДЁННЫХ номеров, указывается в `number_id`
              (id из `GET /settings/confirmed_numbers`, у номера должно быть подтверждение).

            Произвольный внешний номер не принимается: соединять можно только с внутренним или
            с номером, владение которым подтверждено. Тулы, сохранённые до появления этого поля,
            считаются `extension`.

            ⚠️ Если тул не проходит проверку (нет `ext`, номер не подтверждён и т.п.), запрос
            целиком отклоняется с `422` и причиной в `errors.tools` — агент не сохраняется без
            него молча.
        number_id:
          type: integer
          nullable: true
          description: |
            Только для `type=transfer` при `target=number`. Id подтверждённого номера из
            `GET /settings/confirmed_numbers`. Номер перепроверяется в момент звонка: если подтверждение
            с тех пор сняли, соединения не будет, и агент скажет абоненту, что передаст просьбу.
          example: 12
        ext:
          type: string
          maxLength: 8
          pattern: '^[0-9]{1,8}$'
          description: |
            Только для `type=transfer` при `target=extension`. Внутренний номер вашей АТС,
            только цифры.

            ⚠️ Агенту этот номер НЕ передаётся: он знает лишь `label`, а набор выполняет
            платформа. Поэтому номер не может прозвучать в трубке.

            ⚠️ Перевод работает только в обзвонах через вашу АТС (`user_pbx_id` у обзвона).
            В обзвоне через нашу связь действие агенту не предлагается, и он о нём не знает.
          example: "2191"
        pbx_id:
          type: integer
          nullable: true
          description: |
            Только для `type=transfer`. Через какую из ваших АТС соединять при кнопке
            «Протестировать».

            ⚠️ В обзвоне это поле НЕ используется: перевод всегда идёт через станцию, выбранную
            в самом обзвоне (`user_pbx_id`). Оба плеча звонка обязаны идти одним путём.
        headers:
          type: array
          maxItems: 10
          description: Только для `type=http`. Заголовки запроса, в т.ч. авторизация.
          items:
            type: object
            required: [key]
            properties:
              key: { type: string, maxLength: 100 }
              value: { type: string, maxLength: 500 }
        bodyType:
          type: string
          enum: [none, json]
          default: none
          description: Только для `type=http`.
        body:
          type: string
          maxLength: 2000
          description: Только для `type=http`. Тело запроса при `bodyType=json`. Поддерживает `{{переменные}}`.
        response_template:
          type: string
          maxLength: 500
          description: |
            Только для `type=http`. Фраза, которую агент произнесёт вслух, с подстановкой
            полей из ответа вашего сервера — например `Ваш заказ {{status}}`. Сырой JSON
            абоненту никогда не зачитывается.
        fallback:
          type: string
          maxLength: 300
          description: Только для `type=http`. Что сказать, если запрос не удался.

    Agent:
      type: object
      properties:
        id: { type: integer }
        client_id: { type: [string, "null"] }
        name: { type: string }
        voice: { type: string, description: Технический идентификатор голоса }
        voice_name: { type: string, description: Название голоса в личном кабинете }
        gender: { type: string, enum: [male, female] }
        prompt: { type: [string, "null"] }
        data_schema:
          type: array
          items: { $ref: '#/components/schemas/AgentDataField' }
        tools:
          type: array
          items: { $ref: '#/components/schemas/AgentTool' }
        max_seconds: { type: integer }
        status:
          type: string
          enum: [draft, generating, ready, failed]
        active: { type: boolean }
        used:
          type: integer
          description: В скольких обзвонах агент уже задействован.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AgentCreate:
      type: object
      required: [name, voice, prompt, data_schema]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          description: Имя агента — он представляется им в разговоре.
        voice:
          type: string
          description: Идентификатор голоса из `GET /agents/voices`.
        prompt:
          type: string
          minLength: 1
          maxLength: 10000
          description: |
            Сценарий разговора обычным текстом.

            **Обязательно** содержит три непустые секции — `## Кто ты`, `## Задача звонка`,
            `## Ход разговора`. Без любой из них — `422`. Подробности и пример — в описании
            `POST /agents`.

            Правила безопасности дописываются нами автоматически — включать их в текст не нужно.
        data_schema:
          type: array
          minItems: 1
          maxItems: 30
          description: Поля, которые агент должен вынести из разговора.
          items: { $ref: '#/components/schemas/AgentDataField' }
        tools:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/AgentTool' }
        max_seconds:
          type: integer
          default: 300
          minimum: 120
          maximum: 600
          description: Потолок длительности разговора в секундах. Он же потолок стоимости звонка.
        client_id:
          type: string
          maxLength: 60
          description: Ваш идентификатор агента — по нему агента можно найти через `GET /agents?client_id=`.

    AgentUpdate:
      type: object
      description: Все поля необязательны — меняются только присланные.
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        voice: { type: string }
        prompt:
          type: string
          minLength: 1
          maxLength: 10000
          description: |
            Присылаете — присылайте сценарий целиком. Требование к секциям то же, что при
            создании: `## Кто ты`, `## Задача звонка`, `## Ход разговора` должны быть на месте
            и непустыми.
        data_schema:
          type: array
          minItems: 1
          maxItems: 30
          items: { $ref: '#/components/schemas/AgentDataField' }
        tools:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/AgentTool' }
        max_seconds: { type: integer, minimum: 120, maximum: 600 }
        active: { type: boolean, description: "`false` — временно вывести агента из оборота." }
        client_id: { type: string, maxLength: 60 }

    AutocallSummary:
      type: object
      properties:
        id: { type: integer }
        client_id: { type: [string, "null"] }
        name: { type: string }
        date_from: { type: string }
        time_from: { type: string }
        time_to: { type: string }
        max_tries: { type: integer }
        tries_interval: { type: integer }
        type:
          type: string
          enum: [regular, interactive, agent]
        status:
          type: string
          enum: [running, completed, awaiting, moderation, denied]
        max_cost: { type: [number, string] }
        final_cost: { type: [number, string, "null"] }
        topup_cost:
          type: [number, string, "null"]
          description: >-
            Досписание за абонентов, которые перезвонили сами уже после завершения обзвона.
            Они проходят сценарий целиком, поэтому распознавание, синтез, SMS, разговор с
            ИИ-агентом и запись оплачиваются отдельной операцией; связь за входящий звонок
            не тарифицируется. Значение уже входит в final_cost. null — добора не было.
        topped_up_at:
          type: [string, "null"]
          format: date-time
          description: Когда отработал досчёт за перезвонивших. null — ещё не отработал.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AutocallCreate:
      type: object
      required: [name, type, list_id]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        time_from: { type: string, default: "12:00:00", minLength: 8, maxLength: 8 }
        time_to: { type: string, default: "18:00:00", minLength: 8, maxLength: 8 }
        type:
          type: string
          enum: [regular, interactive, agent]
          default: regular
        audio_id:
          type: array
          description: "Обязательно если type=regular. ID аудиозаписей или объекты для создания новых."
          items:
            oneOf:
              - type: integer
              - type: object
                required: [type, data]
                properties:
                  type: { type: string, enum: [synthesis, upload] }
                  data:
                    type: object
                    properties:
                      text: { type: string, minLength: 1, maxLength: 400, description: "Текст для синтеза. У голосов с emotions=true поддерживает подсказки интонации в квадратных скобках — см. POST /sounds." }
                      voice:
                        type: string
                        default: Sulafat
                        description: Идентификатор голоса из `GET /sounds/voices`. По умолчанию `Sulafat`.
                      speed: { type: number, default: 1, minimum: 0.25, maximum: 4 }
                      pitch: { type: number, default: 0, minimum: -20, maximum: 20, description: "Только для голосов с pitch=true в GET /sounds/voices." }
                      file: { type: string, description: Base64 строка файла mp3/wav/ogg }
        scenario_id: { type: integer, description: "Обязательно если type=interactive." }
        agent_id:
          type: integer
          description: |
            Обязательно если `type=agent`. ID вашего ИИ-агента со статусом `ready`
            (см. `GET /agents`). Агент в статусе `generating`, отключённый (`active=false`)
            или удалённый вернёт `422`.
        list_id:
          type: array
          minItems: 1
          maxItems: 5000
          items:
            oneOf:
              - type: integer
              - type: object
                required: [number]
                properties:
                  number: { type: string, minLength: 12, maxLength: 12 }
                  extra: { type: string, maxLength: 255 }
                  variables:
                    type: object
                    description: |
                      Переменные контакта для подстановки в SMS-тексты (`text`, `text_unanswered`)
                      через `{{varname}}`. Ключи — `[a-zA-Z0-9_]` (до 30 символов),
                      значения — строки (до 255 символов).
                    additionalProperties: { type: string }
                    example: { name: "Иван", debt: "15000" }
        max_tries: { type: integer, default: 1, enum: [1, 2, 3, 4] }
        tries_interval: { type: integer, default: 60, enum: [15, 30, 60, 120] }
        date_from: { type: string, minLength: 10, maxLength: 10 }
        sms: { type: boolean, default: false, description: "Отправить SMS при успешном дозвоне?" }
        text:
          type: string
          description: |
            Текст SMS при успешном дозвоне (обязательно если `sms=true`).
            Поддерживает переменные контакта `{{varname}}` — например `Здравствуйте, {{name}}!`.
        sms_unanswered: { type: boolean, default: false, description: "Отправить SMS если не дозвонились?" }
        text_unanswered:
          type: string
          description: |
            Текст SMS для недозвонившихся (обязательно если `sms_unanswered=true`).
            Поддерживает переменные контакта `{{varname}}`.
        lifetime: { type: boolean, default: false, deprecated: true, description: "Не используется с 1.13.3. Поле принимается и сохраняется ради совместимости, но на поведение не влияет: обзвон всегда завершается сразу, а услуги, оказанные перезвонившим абонентам, досчитываются отдельным списанием после закрытия окна перезвонов." }
        record: { type: boolean, default: false, description: "Записывать разговоры?" }
        client_id: { type: string, maxLength: 60 }
        callback_url: { type: string, maxLength: 256 }
        caller_id:
          type: string
          nullable: true
          maxLength: 20
          description: |
            Номер для исходящих звонков. Если не указан или `null` — выбирается случайный номер из пула.
            Можно передать конкретный арендованный вами номер (например `+77086469620`).
            Номер должен быть арендован вами и не истёкшим. Получить список арендованных номеров: `GET /caller-ids`.
        user_pbx_id:
          type: integer
          nullable: true
          description: |
            Звонить через вашу собственную АТС, подключённую в разделе «Мои АТС».

            Если не указан или `null` — обзвон идёт через нашу связь и тарифицируется по обычной
            цене секунды. С указанной АТС связь оплачиваете вы своему оператору, а с нас —
            только ёмкость платформы, поэтому секунда стоит дешевле (`own_pbx_price` в тарифах).

            АТС должна принадлежать вам и быть включённой. Повторные попытки дозвона через свою
            АТС бесплатны. Номер, который увидит абонент, подставляет ваша станция, поэтому
            `caller_id` для таких обзвонов не используется.

    AutocallDetail:
      allOf:
        - $ref: '#/components/schemas/AutocallSummary'
        - type: object
          properties:
            sms: { type: boolean }
            sms_unanswered: { type: boolean }
            text: { type: [string, "null"] }
            text_unanswered: { type: [string, "null"] }
            audio_id: { type: [array, "null"], items: { type: [number, string] } }
            scenario_id: { type: [integer, "null"] }
            agent_id: { type: [integer, "null"], description: ИИ-агент обзвона (только для type=agent) }
            processed: { type: integer }
            speeches: { type: integer }
            lifetime: { type: boolean }
            record: { type: boolean }
            comment: { type: [string, "null"] }
            callback_url: { type: [string, "null"] }
            caller_id: { type: [string, "null"], description: Арендованный номер для звонков (null = случайный из пула) }
            user_pbx_id: { type: [integer, "null"], description: "Своя АТС клиента, через которую шёл обзвон (null = наша связь). Остаётся заполненным и после удаления АТС." }
            finished_at: { type: [string, "null"] }
            calls_count: { type: integer }
            processed_percentage: { type: number }
            counters:
              type: object
              properties:
                success_percentage: { type: number }
                success: { type: integer }
                recalled: { type: integer }
                no_answer: { type: integer }
                busy: { type: integer }
                error: { type: integer }
                spam: { type: integer }
                tries: { type: integer }
                duration: { type: integer, description: Всего секунд разговора (биллинг) }
                total: { type: integer }
            calls:
              allOf:
                - $ref: '#/components/schemas/Pagination'
                - type: object
                  properties:
                    data:
                      type: array
                      items: { $ref: '#/components/schemas/Call' }

    Call:
      type: object
      required: [id, autocall_id, number, extra, lock, tries, date_tries, status_tries, last_try_at, duration, r_duration, status, created_at, updated_at]
      properties:
        id: { type: integer }
        autocall_id: { type: integer }
        number: { type: string }
        extra: { type: [string, "null"] }
        lock: { type: boolean, description: Идёт ли звонок прямо сейчас }
        tries: { type: integer }
        date_tries: { type: [array, "null"], items: { type: string } }
        status_tries: { type: [array, "null"], items: { type: string } }
        last_try_at: { type: [string, "null"] }
        duration: { type: integer, description: Длительность исходящего разговора в секундах (биллинг) }
        r_duration: { type: integer, description: Длительность входящего разговора (бесплатно) }
        status:
          type: string
          enum: [in_queue, success, recalled, no_answer, busy, error, spam]
        data:
          type: [object, "null"]
          description: |
            Результаты прохождения сценария и поля, извлечённые ИИ-агентом.

            Ключи, начинающиеся с подчёркивания, — служебные и не являются частью
            публичного контракта: они могут измениться без предупреждения. В частности,
            расшифровку разговора берите ручкой `GET /calls/{id}/transcript`, а не из
            `data._transcript`.
        variables:
          type: [object, "null"]
          description: Переменные контакта, скопированные при создании обзвона. Используются для подстановки в SMS текст.
          additionalProperties: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    BulkSummary:
      type: object
      properties:
        id: { type: integer }
        client_id: { type: [string, "null"] }
        name: { type: string }
        status:
          type: string
          enum: [running, completed, awaiting, moderation, denied]
        date_from: { type: string }
        time_from: { type: string }
        text: { type: string }
        segments: { type: integer, description: Количество SMS сегментов }
        recipients: { type: integer }
        list_id: { type: array, items: { type: integer } }
        max_cost: { type: [string, number] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    BulkDetail:
      allOf:
        - $ref: '#/components/schemas/BulkSummary'
        - type: object
          properties:
            final_cost: { type: [string, number, "null"] }
            comment: { type: [string, "null"] }
            callback_url: { type: [string, "null"] }
            messages:
              allOf:
                - $ref: '#/components/schemas/Pagination'
                - type: object
                  properties:
                    data:
                      type: array
                      items: { $ref: '#/components/schemas/Message' }

    Message:
      type: object
      required: [id, bulk_id, number, extra, variables, status, provider, init_time, status_time, created_at, updated_at]
      properties:
        id: { type: integer }
        bulk_id: { type: integer }
        number: { type: string }
        extra: { type: [string, "null"] }
        variables:
          type: [object, "null"]
          description: Переменные контакта, скопированные на момент создания рассылки. Используются для подстановки в текст.
          additionalProperties: { type: string }
        status:
          type: string
          enum: [queued, disabled, new, sent, delivered, pending, failed, expired, undeliverable, rejected]
          description: |
            | Статус | Значение | Окончательный |
            |--------|----------|---------------|
            | `queued` | в очереди | нет |
            | `new` | создано | нет |
            | `sent` | отправлено | нет |
            | `pending` | ждём отчёта | нет |
            | `delivered` | доставлено | да |
            | `failed` | ошибка | да |
            | `expired` | истекло время ожидания | да |
            | `undeliverable` | не доставлено | да |
            | `rejected` | отклонено оператором | да |
            | `disabled` | удалено | да |
        provider: { type: string, description: Мобильный оператор получателя }
        init_time: { type: [string, "null"], description: Дата отправки }
        status_time: { type: [string, "null"], description: Дата последнего изменения статуса }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ConfirmedNumber:
      type: object
      required: [id, number, verified_at, created_at, updated_at]
      properties:
        id: { type: integer }
        number: { type: string, description: Номер в формате +7XXXXXXXXXX }
        verified_at:
          type: [string, "null"]
          description: Дата подтверждения. Неподтверждённые удаляются через 10 минут.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AccountSettings:
      type: object
      properties:
        name: { type: string }
        phone: { type: string, description: Номер телефона без +7 }
        sms_verified_at: { type: string }
        moderation: { type: boolean, description: Включена ли модерация }
        time_from: { type: string, description: С какого времени разрешены рассылки/обзвоны }
        time_to: { type: string, description: До какого времени разрешены рассылки/обзвоны }
        price: { type: string, description: Тариф — стоимость за секунду обзвона (₸) }
        sms_price: { type: string, description: Тариф — стоимость одного SMS (₸) }
        sip_price: { type: string, description: Тариф — стоимость за секунду через АТС (₸) }
        speech_price: { type: string, description: Тариф — стоимость распознавания речи за сеанс (₸) }
        synthesis_price: { type: string, description: Тариф — стоимость синтеза речи за сеанс (₸) }
        recording_price: { type: string, description: Тариф — стоимость записи разговора (₸) }
        recalled: { type: integer, description: Часов отслеживания перезвонивших абонентов }
        subscribe: { type: boolean, description: Подписка на новости через звонки }
        notifications_subscribe: { type: boolean, description: Дублирование уведомлений через SMS }
        visit_card_audio: { type: [integer, "null"] }
        visit_card_text: { type: [string, "null"] }
        confirmed_numbers:
          type: array
          items: { $ref: '#/components/schemas/ConfirmedNumber' }
        statistics:
          type: object
          description: |
            Счётчики аккаунта.

            ⚠️ Поля `duration` (всего минут разговоров) и `calls` (всего попыток дозвона)
            удалены 18.09.2026. Они считались по всей истории звонков аккаунта и на больших
            аккаунтах стоили несколько секунд на запрос. Объёмы за период отдаёт
            `GET /dashboard` — там те же данные по дням и без нагрузки.

            ⚠️ Поле `contacts` (всего контактов во всех списках) удалено 21.09.2026 по той же
            причине: на крупных аккаунтах подсчёт занимал больше десяти секунд. Количество
            контактов в каждом списке по-прежнему отдаёт `GET /lists` (`contacts_count`).
          properties:
            confirmed_numbers: { type: integer }
            spam_reports: { type: integer }
            lists: { type: integer }
            autocalls: { type: integer }
            bulks: { type: integer }
            sms: { type: integer }

    Transaction:
      type: object
      properties:
        id: { type: integer }
        type:
          type: string
          enum: [withdraw, deposit]
          description: withdraw — расход, deposit — приход
        confirmed: { type: boolean }
        meta:
          type: object
          properties:
            description: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        total:
          type: number
          description: Сумма (отрицательная для withdraw, положительная для deposit)

    Notification:
      type: object
      required: [id, type, read_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum:
            - SoundConfirmed
            - SoundCommented
            - SMSBulkConfirmed
            - SMSBulkCommented
            - SMSBulkFinished
            - ScenarioConfirmed
            - ScenarioCommented
            - AutocallConfirmed
            - AutocallCommented
            - AutocallFinished
            - ImportComplete
            - ImportFailure
            - NonexistentContactsDetected
            - ExportIsReady
            - ExportFailure
            - RefreshBalance
            - LowBalance
            - CallerIdExpiringSoon
            - CallerIdReleased
        data:
          type: object
          description: Содержимое уведомления (структура зависит от типа)
          properties:
            id: { type: integer }
            name: { type: string }
            type:
              type: string
              enum: [autocall, bulk]
            action:
              type: string
              enum: [deposit, withdraw]
            amount: { type: string }
            balance: { type: number, description: Текущий баланс (для LowBalance) }
            threshold: { type: number, description: Порог баланса (для LowBalance) }
        read_at: { type: [string, "null"], description: Дата прочтения (null если не прочитано) }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }