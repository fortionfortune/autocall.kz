            example:
              name: "Жандос"
              subscribe: true
              notifications_subscribe: false
              visit_card_text: "Компания AutoCall.kz, тел: +77470000000"
      responses:
        '200':
          description: Обновлённые настройки аккаунта.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountSettings' }
        '401': { $ref: '#/components/responses/401' }
        '422': { $ref: '#/components/responses/422' }
        '429': { $ref: '#/components/responses/429' }
        '500': { $ref: '#/components/responses/500' }

  /settings/{visit_card_type}:
    parameters:
      - name: visit_card_type
        in: path
