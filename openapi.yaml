  # ─────────────────────────────────────────
  # АУДИОЗАПИСИ
  # ─────────────────────────────────────────

  /sounds/voices:
    get:
      summary: Получить список голосов синтеза
      operationId: get-synthesis-voices
      tags: [Аудиозаписи]
      description: |
        Голоса, доступные в поле `voice` при синтезе речи.

        У каждого голоса есть `sample_url` — прямая ссылка на короткий сэмпл (m4a), по которой
        его можно послушать перед выбором.

        Поле `realtime` показывает, годится ли голос для элемента «Сказать текст» в сценарии:
        там синтез идёт **во время звонка**, поэтому подходят только быстрые голоса. Если
        указать голос с `realtime: false`, он будет автоматически заменён на быстрый — абонент
        иначе слушал бы несколько секунд тишины.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  default:
                    type: string
                    description: Голос, который используется, если поле `voice` не передано
                    example: Sulafat
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        name:       { type: string, description: "Значение для поля `voice`", example: Sulafat }
                        title:      { type: string, description: Название в личном кабинете, example: Айгерим }
                        gender:     { type: string, enum: [male, female] }
                        languages:  { type: array, items: { type: string }, description: "Языки голоса (kk, ru, en)" }
                        realtime:   { type: boolean, description: Годится ли для озвучки во время звонка }
                        pitch:      { type: boolean, description: "Поддерживает ли голос параметр `pitch` (высота тона)" }
                        emotions:   { type: boolean, description: "Понимает ли пометки эмоций в тексте — см. описание поля `text`" }
                        sample_url: { type: string, format: uri, description: Ссылка на сэмпл голоса }
              example:
                default: Sulafat
                data:
                  - name: Sulafat
                    title: Айгерим
                    gender: female
                    languages: [kk, ru, en]
                    realtime: false
                    pitch: false
                    emotions: true
                    sample_url: https://autocall.kz/voices/tts-samples/Sulafat.m4a
                  - name: madi
                    title: Мади
                    gender: male
                    languages: [kk]
                    realtime: true
                    pitch: true
                    emotions: false
                    sample_url: https://autocall.kz/voices/tts-samples/madi.m4a
        '401': { $ref: '#/components/responses/401' }
        '429': { $ref: '#/components/responses/429' }
        '500': { $ref: '#/components/responses/500' }

  /sounds:
    get:
      summary: Получить все аудиозаписи
      operationId: get-sounds
      tags: [Аудиозаписи]
      description: Возвращает все аудиозаписи аккаунта с постраничным выводом.
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Постраничный вывод аудиозаписей.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Sound'
        '401': { $ref: '#/components/responses/401' }
        '429': { $ref: '#/components/responses/429' }

    post:
      summary: Создать аудиозапись
      operationId: post-sounds
      tags: [Аудиозаписи]
      description: |
        Создаёт аудиозапись двумя способами:
        - `synthesis` — синтез речи из текста
        - `upload` — загрузка файла mp3/wav/ogg в формате Base64
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      requestBody:
        required: true
        description: Параметры новой аудиозаписи.
        content:
          application/json:
            schema:
              type: object
              required: [name, type, data]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 40
                  description: Название аудиозаписи
                type:
                  type: string
                  enum: [synthesis, upload]
                  description: Тип — синтез речи или загрузка файла
                data:
                  type: array
                  minItems: 1
                  maxItems: 1
                  description: Массив с одним объектом параметров аудио
                  items:
                    type: object
                    properties:
                      text:
                        type: string
                        minLength: 1
                        maxLength: 400
                        description: >
                          Если `type=synthesis`: текст для синтеза (обязательно).


                          У голосов с `emotions: true` в тексте можно ставить подсказку интонации в
                          квадратных скобках — она задаёт, КАК произнести следующую фразу, и вслух не
                          читается: `Здравствуйте! [радостно] Ваш заказ уже в пути.`
                          Подойдёт почти любое слово: радостно, грустно, шёпотом, устало, строго, смеюсь.
                          У голосов с `emotions: false` такие пометки вырезаются перед синтезом —
                          текст озвучится без них, ошибки не будет.
                      voice:
                        type: string
                        default: Sulafat
                        description: >
                          Если `type=synthesis`: голос для синтеза.
                          Полный список с прослушиванием — в [`GET /sounds/voices`](#/paths/~1sounds~1voices/get):
                          там у каждого голоса есть `sample_url`, по которой сэмпл можно послушать.
                          Список намеренно не продублирован здесь — голоса добавляются и выключаются,
                          и копия в документации протухла бы к следующему релизу.
                          Если поле не передано, используется `Sulafat` (женский, казахский/русский/английский).
                      speed:
                        type: number
                        default: 1
                        minimum: 0.25
                        maximum: 4
                        description: "Если type=synthesis: скорость речи"
                      pitch:
                        type: number
                        default: 0
                        minimum: -20
                        maximum: 20
                        description: >
                          Если `type=synthesis`: высота тона.
                          Работает только у голосов с `pitch: true` в `GET /sounds/voices`.
                          Новые голоса такого параметра не имеют, и для них значение игнорируется.
                      file:
                        type: string
                        description: "Если type=upload: файл в формате Base64 (mp3/wav/ogg, обязательно)"
                client_id:
                  type: string
                  maxLength: 60
                  description: ID в Вашей системе
            examples:
              Синтез речи:
                value:
                  name: "Уведомление об оплате"
                  type: synthesis
                  data:
                    - text: "Здравствуйте! Напоминаем об оплате до конца месяца."
                      voice: Sulafat
                      speed: 1
              Загрузка файла:
                value:
                  name: "Моё приветствие"
                  type: upload
                  data:
                    - file: "base64_строка_файла_mp3"
      responses:
        '201':
          description: Аудиозапись создана и отправлена на модерацию.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sound' }
        '401': { $ref: '#/components/responses/401' }
        '402':
          description: Недостаточно средств для синтеза речи.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorMessage' }
        '422': { $ref: '#/components/responses/422' }
        '429': { $ref: '#/components/responses/429' }
        '500': { $ref: '#/components/responses/500' }

  /sounds/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
        description: ID аудиозаписи
    get:
      summary: Показать аудиозапись
      operationId: get-sounds-id
      tags: [Аудиозаписи]
      description: Возвращает детальную информацию об аудиозаписи.
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      responses:
        '200':
          description: Объект аудиозаписи.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sound' }
        '401': { $ref: '#/components/responses/401' }
        '404': { $ref: '#/components/responses/404' }
        '429': { $ref: '#/components/responses/429' }
    put:
      summary: Редактировать аудиозапись
      operationId: put-sounds-id
      tags: [Аудиозаписи]
      description: Изменяет название или client_id аудиозаписи.
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 40
                client_id:
                  type: string
                  maxLength: 60
      responses:
        '200':
          description: Обновлённый объект аудиозаписи.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sound' }
        '401': { $ref: '#/components/responses/401' }
        '404': { $ref: '#/components/responses/404' }
        '422': { $ref: '#/components/responses/422' }
        '429': { $ref: '#/components/responses/429' }
        '500': { $ref: '#/components/responses/500' }
    delete:
      summary: Удалить аудиозапись
      operationId: delete-sounds-id
      tags: [Аудиозаписи]
      description: Удаляет аудиозапись из аккаунта.
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      responses:
        '204':
          description: Аудиозапись удалена.
        '401': { $ref: '#/components/responses/401' }
        '404': { $ref: '#/components/responses/404' }
        '422': { $ref: '#/components/responses/422' }
        '429': { $ref: '#/components/responses/429' }
        '500': { $ref: '#/components/responses/500' }

  /sounds/listen/{file}:
    parameters:
      - name: file
        in: path
        required: true
        schema: { type: string }
        description: Имя аудиофайла из поля `data` интерактивных обзвонов
    get:
      summary: Получить запись из интерактивного обзвона
      operationId: get-sounds-listen-file
      tags: [Аудиозаписи]
      description: |
        Доступ к записям голосовых ответов абонентов в интерактивных обзвонах (элемент типа `record`).

        В зависимости от параметра `type`:
        - `download` — сервер вернёт файл для скачивания
        - `text` — сервер вернёт JSON с распознанным текстом (тарифицируется)
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum: [download, text]
          description: Способ получения записи
      responses:
        '200':
          description: Файл для скачивания или объект с текстом.
          content:
            application/json:
              schema:
                type: object
                required: [text]
                properties:
                  text:
                    type: [string, "null"]
                    description: Распознанный текст (только при type=text)
        '401': { $ref: '#/components/responses/401' }
        '402':
          description: Недостаточно средств для распознавания речи.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorMessage' }
        '404': { $ref: '#/components/responses/404' }
        '422': { $ref: '#/components/responses/422' }
        '429': { $ref: '#/components/responses/429' }

  # ─────────────────────────────────────────
  # СЦЕНАРИИ
  # ─────────────────────────────────────────

  /scenarios:
    get:
      summary: Получить все сценарии
      operationId: get-scenarios
      tags: [Сценарии]
      description: Возвращает все сценарии аккаунта с постраничным выводом.
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Постраничный вывод сценариев.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Scenario'
        '401': { $ref: '#/components/responses/401' }
        '429': { $ref: '#/components/responses/429' }

    post:
      summary: Создать сценарий
      operationId: post-scenarios
      tags: [Сценарии]
      description: Создаёт новый интерактивный сценарий для обзвонов. Сценарий передаётся как JSON-строка в параметре `data`.
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      requestBody:
        required: true
        description: Параметры нового сценария.
        content:
          application/json:
            schema:
              type: object
              required: [name, data]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 40
                  description: Название сценария
                data:
                  type: string
                  description: |
                    Граф сценария — JSON-объект, **сериализованный в строку** (`json_encode` в PHP,
                    `JSON.stringify` в JS, `json.dumps` в Python). Ключи объекта = id элементов.

                    📖 **Полный справочник структуры, всех типов элементов и три готовых примера —
                    в описании раздела «Сценарии» выше.** Ниже — минимальный рабочий сценарий
                    (объект ДО сериализации):
                    ```json
                    {
                      "START":       { "id": "START", "type": "start", "name": "Начало", "next": "TALK_DETECT" },
                      "TALK_DETECT": { "id": "TALK_DETECT", "type": "talk_detect", "name": "Ждём речи", "next": "a1b2c3" },
                      "a1b2c3":      { "id": "a1b2c3", "type": "playback", "name": "Приветствие", "next": "END", "data": 12345 },
                      "END":         { "id": "END", "type": "end", "name": "Конец", "next": null }
                    }
                    ```
                    `data: 12345` у `playback` — id Вашей аудиозаписи (см. раздел «Аудиозаписи»).

                    Доступные типы: `start`, `talk_detect`, `end`, `playback`, `record`, `dtmf`,
                    `speech`, `dial`, `sms`, `sms_me`, `request`, `say`, `stt_var`, `setvar`,
                    `ifelse`, `switchvar` — те же, что и в конструкторе на сайте.
                client_id:
                  type: string
                  maxLength: 60
                  description: ID в Вашей системе
      responses:
        '201':
          description: Сценарий создан и отправлен на модерацию.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Scenario' }
        '401': { $ref: '#/components/responses/401' }
        '422': { $ref: '#/components/responses/422' }
        '429': { $ref: '#/components/responses/429' }
        '500': { $ref: '#/components/responses/500' }

  /scenarios/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
        description: ID сценария
    get:
      summary: Показать сценарий
      operationId: get-scenarios-id
      tags: [Сценарии]
      description: Возвращает детальную информацию о сценарии, включая его структуру.
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      responses:
        '200':
          description: Объект сценария с полной структурой.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScenarioDetail' }
        '401': { $ref: '#/components/responses/401' }
        '404': { $ref: '#/components/responses/404' }
        '429': { $ref: '#/components/responses/429' }
    put:
      summary: Редактировать сценарий
      operationId: put-scenarios-id
      tags: [Сценарии]
      description: |
        Изменяет название, структуру или client_id сценария. Передавайте только те поля,
        которые меняете.

        ⚠️ `data` здесь — такая же **строка** с закодированным JSON, как при создании.
        А `GET /scenarios/{id}` отдаёт `data` уже **объектом**: чтобы изменить существующий
        сценарий, разберите ответ, поправьте нужный элемент и сериализуйте обратно.
        Структура графа целиком — в описании раздела «Сценарии».
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 40 }
                data:
                  type: string
                  description: Новый граф сценария, сериализованный в строку. Заменяет структуру целиком.
                client_id: { type: string, maxLength: 60 }
      responses:
        '200':
          description: Обновлённый объект сценария.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScenarioDetail' }
        '401': { $ref: '#/components/responses/401' }
        '404': { $ref: '#/components/responses/404' }
        '422': { $ref: '#/components/responses/422' }
        '429': { $ref: '#/components/responses/429' }
        '500': { $ref: '#/components/responses/500' }
    delete:
      summary: Удалить сценарий
      operationId: delete-scenarios-id
      tags: [Сценарии]
      description: Удаляет сценарий из аккаунта.
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      responses:
        '204':
          description: Сценарий удалён.
        '401': { $ref: '#/components/responses/401' }
        '404': { $ref: '#/components/responses/404' }
        '422': { $ref: '#/components/responses/422' }
        '429': { $ref: '#/components/responses/429' }
        '500': { $ref: '#/components/responses/500' }

  # ─────────────────────────────────────────
  # ИИ-АГЕНТЫ
  # ─────────────────────────────────────────

  /agents:
    get:
      summary: Получить всех ИИ-агентов
      operationId: get-agents
      tags: [ИИ-агенты]
      description: |
        Возвращает всех агентов аккаунта с постраничным выводом.

        #### Статусы агента
        | Статус | Значение | Можно в обзвон |
        |--------|----------|----------------|
        | `generating` | считаются параметры агента | нет |
        | `ready` | готов | да |
        | `failed` | не удалось подготовить | нет |
        | `draft` | черновик из мастера в личном кабинете | нет |
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
        - $ref: '#/components/parameters/ClientIdFilter'
        - $ref: '#/components/parameters/Page'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [draft, generating, ready, failed]
          description: Оставить только агентов с этим статусом.
      responses:
        '200':
          description: Постраничный вывод агентов.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Agent' }
        '401': { $ref: '#/components/responses/401' }
        '404': { $ref: '#/components/responses/404' }
        '429': { $ref: '#/components/responses/429' }

    post:
      summary: Создать ИИ-агента
      operationId: post-agents
      tags: [ИИ-агенты]
      description: |
        Создаёт голосового ИИ-агента. В ответе агент со статусом `generating` —
        дождитесь `ready` (опрашивайте `GET /agents/{id}`), прежде чем ставить его в обзвон.

        #### Из чего состоит агент
        - **`prompt`** — сценарий разговора обычным текстом. Обязан содержать три секции,
          см. ниже. Правила безопасности мы дописываем сами — их указывать не нужно.
        - **`data_schema`** — что агент должен вынести из разговора. Эти поля попадут
          в результат звонка и в выгрузку обзвона.
        - **`tools`** — необязательные действия по ходу разговора: отправить SMS (`sms`)
          или сходить запросом на ваш сервер и озвучить ответ (`http`).
        - **`voice`** — голос агента, из `GET /agents/voices`.
        - **`max_seconds`** — потолок длительности разговора. Он же потолок стоимости звонка.

        #### Обязательные секции `prompt`
        Сценарий должен содержать три секции — иначе `422`:

        | Секция | Что в ней |
        |--------|-----------|
        | `## Кто ты` | Имя агента, от лица какой компании звонит, характер в 2–4 словах |
        | `## Задача звонка` | Чего добиться, 1–2 предложения, конкретно |
        | `## Ход разговора` | Шаги разговора. Первым шагом — дословная первая фраза |

        Секция — это заголовок `## Название` (можно глубже: `###`) и **непустой** текст под ним.
        Регистр и лишние пробелы не важны, порядок секций — любой.

        Дальше по желанию — `## Что собрать`, `## Инструменты`, `## Границы` (чего не обещать,
        что отвечать на неудобные вопросы) и любые свои секции.

        ⚠️ Чем длиннее `prompt`, тем дороже каждый звонок: сценарий заново отправляется модели
        на каждой реплике. Пишите плотно, без воды и повторов.
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentCreate' }
            examples:
              Простой агент — подтверждение записи:
                value:
                  name: "Асель"
                  voice: "Sulafat"
                  max_seconds: 180
                  prompt: |
                    ## Кто ты
                    Асель — женский голос стоматологии «Дента». Звонишь пациенту подтвердить
                    запись на приём. Характер: спокойная, вежливая, без напора.

                    ## Задача звонка
                    Узнать, придёт ли пациент в назначенное время. Если не придёт — предложить
                    перенести на другой день и записать желаемую дату.

                    ## Ход разговора
                    1. Первая фраза РОВНО: «Здравствуйте! Это Асель, стоматология Дента.
                       Вы записаны к нам на приём — подскажите, всё в силе?»
                    2. Подтвердил — поблагодари, напомни время и попрощайся.
                    3. Не придёт — спроси, на какой день перенести, повтори дату вслух.
                    4. Просит перезвонить позже — согласись и заверши разговор.

                    ## Границы
                    Про цены: консультация бесплатная, стоимость лечения врач назовёт на приёме.
                    Не ставь диагнозов и не обещай скидок.
                  data_schema:
                    - { key: "confirmed", label: "Подтвердил приём" }
                    - { key: "new_date", label: "Просит перенести на" }
                    - { key: "comment", label: "Комментарий" }
              Агент с SMS и запросом на ваш сервер:
                value:
                  name: "Ерлан"
                  voice: "Charon"
                  max_seconds: 300
                  client_id: "sales-agent-v2"
                  prompt: |
                    ## Кто ты
                    Ерлан — мужской голос интернет-магазина «Технодом». Звонишь клиенту,
                    который оставил заявку на сайте. Характер: бодрый, деловой.

                    ## Задача звонка
                    Выяснить, актуален ли заказ, и ответить на вопросы клиента по нему.

                    ## Ход разговора
                    1. Первая фраза РОВНО: «Здравствуйте! Ерлан, магазин Технодом.
                       Вы оставляли заявку — вам ещё актуально?»
                    2. Актуально — уточни, есть ли вопросы, и передай заказ в работу.
                    3. Спрашивает про доставку — скажи «секундочку, посмотрю» и проверь статус.
                    4. Просит прайс — предложи отправить SMS и отправь.

                    ## Границы
                    Сроки доставки называй только те, что вернул сервер. Скидок не обещай.
                  data_schema:
                    - { key: "interested", label: "Заказ актуален" }
                    - { key: "question", label: "Вопрос клиента" }
                  tools:
                    - type: sms
                      name: "price"
                      when: "клиент попросил прислать прайс"
                      text: "Прайс-лист: https://example.kz/price"
                    - type: http
                      name: "delivery"
                      when: "клиент спрашивает о статусе доставки"
                      method: GET
                      url: "https://api.example.kz/delivery?phone={{phone}}"
                      headers:
                        - { key: "Authorization", value: "Bearer ВАШ_ТОКЕН" }
                      bodyType: none
                      response_template: "Ваш заказ {{status}}, ожидайте {{eta}}."
                      fallback: "Не получилось проверить прямо сейчас, перезвоним."
      responses:
        '201':
          description: Агент создан, идёт подготовка (`status=generating`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        '401': { $ref: '#/components/responses/401' }
        '422': { $ref: '#/components/responses/422' }
        '429': { $ref: '#/components/responses/429' }
        '500': { $ref: '#/components/responses/500' }

  /agents/voices:
    get:
      summary: Получить список голосов
      operationId: get-agent-voices
      tags: [ИИ-агенты]
      description: |
        Доступные голоса агентов. Значение `name` передаётся в поле `voice` при создании агента,
        `sample` — ссылка на аудиофрагмент для прослушивания.

        Пол голоса важен: агент говорит о себе в первом лице, поэтому `prompt` пишите
        в роде выбранного голоса.
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      responses:
        '200':
          description: Список голосов.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Voice' }
        '401': { $ref: '#/components/responses/401' }
        '429': { $ref: '#/components/responses/429' }

  /agents/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
        description: ID агента.
    get:
      summary: Получить ИИ-агента
      operationId: get-agent
      tags: [ИИ-агенты]
      description: Возвращает агента по ID. Этим же запросом опрашивают готовность (`status=ready`).
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      responses:
        '200':
          description: Агент.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        '401': { $ref: '#/components/responses/401' }
        '404': { $ref: '#/components/responses/404' }
        '429': { $ref: '#/components/responses/429' }

    put:
      summary: Изменить ИИ-агента
      operationId: put-agent
      tags: [ИИ-агенты]
      description: |
        Меняет только переданные поля. `data_schema` и `tools` при передаче заменяются
        целиком — чтобы удалить поле или инструмент, пришлите массив без него.

        Изменение `prompt` или `max_seconds` возвращает агента в `generating`: параметры
        считаются заново. Уже созданные обзвоны это не затрагивает — они звонят по слепку
        агента, снятому при создании обзвона.

        `active: false` временно выводит агента из оборота, не удаляя его.
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentUpdate' }
            examples:
              Поправить сценарий:
                value:
                  prompt: |
                    ## Кто ты
                    Асель — женский голос стоматологии «Дента». Характер: спокойная, вежливая.

                    ## Задача звонка
                    Подтвердить запись пациента на приём.

                    ## Ход разговора
                    1. Первая фраза РОВНО: «Здравствуйте! Это Асель из стоматологии Дента.»
                    2. Уточни, придёт ли пациент в назначенное время.
              Временно отключить:
                value:
                  active: false
      responses:
        '200':
          description: Агент изменён.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        '401': { $ref: '#/components/responses/401' }
        '404': { $ref: '#/components/responses/404' }
        '422': { $ref: '#/components/responses/422' }
        '429': { $ref: '#/components/responses/429' }
        '500': { $ref: '#/components/responses/500' }

    delete:
      summary: Удалить ИИ-агента
      operationId: delete-agent
      tags: [ИИ-агенты]
      description: |
        Удаляет агента. Отчёты по уже завершённым обзвонам с ним сохраняются.

        Агента, занятого в незавершённом обзвоне (`running`, `awaiting`, `moderation`),
        удалить нельзя — дождитесь окончания обзвона или остановите его.
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      responses:
        '204':
          description: Агент удалён.
        '401': { $ref: '#/components/responses/401' }
        '403':
          description: Агент занят в незавершённом обзвоне.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorMessage' }
        '404': { $ref: '#/components/responses/404' }
        '429': { $ref: '#/components/responses/429' }
        '500': { $ref: '#/components/responses/500' }

  # ─────────────────────────────────────────
  # ОБЗВОНЫ
  # ─────────────────────────────────────────

  /autocalls:
    get:
      summary: Получить все обзвоны
      operationId: get-autocalls
      tags: [Обзвоны]
      description: |
        Возвращает все обзвоны аккаунта с постраничным выводом.

        #### Статусы обзвонов
        | Статус | Значение | Окончательный |
        |--------|----------|---------------|
        | `running` | выполняется | нет |
        | `completed` | завершён успешно | да |
        | `awaiting` | ожидает своего времени | нет |
        | `moderation` | на модерации | нет |
        | `denied` | запрещён модераторами | да |
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/ClientIdFilter'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Постраничный вывод обзвонов.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AutocallSummary'
        '401': { $ref: '#/components/responses/401' }
        '429': { $ref: '#/components/responses/429' }

    post:
      summary: Создать обзвон
      operationId: post-autocalls
      tags: [Обзвоны]
      description: |
        Создаёт новый обзвон. Поддерживает три типа:
        - `regular` — обычный обзвон с аудиозаписью (нужен `audio_id`)
        - `interactive` — интерактивный обзвон по сценарию (нужен `scenario_id`)
        - `agent` — живой разговор с голосовым ИИ-агентом (нужен `agent_id`)

        В `list_id` можно передавать как ID существующих списков, так и объекты с номерами напрямую (будет создан автоматический список).
        В `audio_id` можно передавать как ID существующих аудиозаписей, так и объекты для создания новых (синтез или загрузка).

        Если общее количество номеров ≤ 5000 — ответ `201` (создан сразу).
        Если > 5000 — ответ `202` (создаётся в фоне).
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      requestBody:
        required: true
        description: Параметры нового обзвона.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutocallCreate'
            examples:
              Отправка OTP:
                summary: Голосовой одноразовый код — одним запросом, без списков и аудиозаписей
                description: |
                  Один запрос — один код. Номер и текст для синтеза передаются прямо в запросе,
                  создавать список и загружать аудио заранее не нужно.

                  **Как писать текст.** Цифры кода разделяйте пробелами (`3 0 7 5`) — тогда
                  голос читает их по одной, а не как число «три тысячи семьдесят пять». Вокруг
                  кода оставляйте постоянную фразу («Ваш код подтверждения…»): она нужна, чтобы
                  модератор мог одобрить ФОРМУ сообщения, а не каждый код по отдельности.

                  **Модерация.** Первый такой обзвон уйдёт на проверку. Модератор может одобрить
                  все будущие коды с той же формулировкой — после этого OTP проходят без ожидания.
                  ⚠️ Код пишите прямо в тексте, а НЕ через переменные `{{code}}`: текст с
                  переменными каждый раз проверяется заново, и OTP будет ждать модератора при
                  каждой отправке.

                  **Время.** Окно `time_from`–`time_to` ограничено вашим тарифом (см. профиль).
                  Для OTP проверьте, что оно покрывает часы, когда вашим клиентам нужен код.

                  `max_tries: 1` — повторный звонок с тем же кодом через час обычно бесполезен:
                  код к тому времени истёк. Вместо повтора — SMS с кодом тем, кто не ответил.
                value:
                  name: "OTP"
                  type: regular
                  time_from: "00:00:00"
                  time_to: "23:59:59"
                  max_tries: 1
                  audio_id:
                    - type: synthesis
                      data:
                        text: "Ваш код подтверждения: 3 0 7 5. Повторяю: 3 0 7 5."
                        voice: Sulafat
                  list_id:
                    - number: "+77010000000"
                  sms_unanswered: true
                  text_unanswered: "Ваш код подтверждения: 3075"
                  callback_url: "https://example.com/otp-status"
              Обычный обзвон:
                value:
                  name: "Уведомление об акции"
                  type: regular
                  time_from: "10:00:00"
                  time_to: "20:00:00"
                  audio_id: [5]
                  list_id: [10]
              Без создания списка — номера прямо в запросе:
                summary: Создавать список контактов заранее НЕ нужно — передайте номера в list_id
                description: |
                  Не обязательно сначала вызывать `POST /lists`. Можно передать номера
                  напрямую в `list_id` как массив объектов `{ "number": "+7..." }` —
                  система сама создаст временный список. То же работает для `audio_id`
                  (можно передать существующий ID или объект для синтеза/загрузки).
                value:
                  name: "Уведомление об акции"
                  type: regular
                  time_from: "10:00:00"
                  time_to: "20:00:00"
                  audio_id: [5]
                  list_id:
                    - number: "+77010000001"
                    - number: "+77010000002"
                    - number: "+77010000003"
              Обзвон ИИ-агентом:
                summary: Живой разговор — агент сам ведёт диалог и заполняет поля результата
                description: |
                  Агент должен быть в статусе `ready` (см. `GET /agents`). Переменные контакта
                  (`variables`) агент знает во время разговора и обращается к абоненту по имени.

                  Аудиозаписи не нужны — весь разговор ведёт агент.
                value:
                  name: "Подтверждение записи на приём"
                  type: agent
                  agent_id: 42
                  time_from: "10:00:00"
                  time_to: "19:00:00"
                  max_tries: 2
                  tries_interval: 60
                  record: true
                  list_id:
                    - number: "+77010000001"
                      variables: { name: "Иван", time: "14:30" }
                    - number: "+77010000002"
                      variables: { name: "Пётр", time: "16:00" }
                  callback_url: "https://example.com/reports"
              Интерактивный обзвон:
                value:
                  name: "Опрос удовлетворённости"
                  type: interactive
                  time_from: "10:00:00"
                  time_to: "18:00:00"
                  scenario_id: 512
                  list_id: [15]
                  max_tries: 3
                  tries_interval: 60
                  record: true
                  callback_url: "https://example.com/reports"
              С новыми номерами и синтезом:
                value:
                  name: "Код подтверждения"
                  type: regular
                  time_from: "00:00:00"
                  time_to: "23:59:59"
                  audio_id:
                    - type: synthesis
                      data:
                        text: "Ваш код подтверждения: 3 0 7 5."
                        voice: Sulafat
                  list_id:
                    - number: "+77010000000"
                  sms_unanswered: true
                  text_unanswered: "Ваш код: 3075"
              С персональными SMS недозвонившимся:
                summary: Переменные подставляются в SMS для тех, кто не ответил
                value:
                  name: "Напоминание о записи"
                  type: regular
                  time_from: "10:00:00"
                  time_to: "20:00:00"
                  audio_id: [5]
                  list_id:
                    - number: "+77010000001"
                      variables: { name: "Иван", time: "14:30" }
                    - number: "+77010000002"
                      variables: { name: "Пётр", time: "16:00" }
                  sms_unanswered: true
                  text_unanswered: "{{name}}, мы не дозвонились. Ждём вас в {{time}}."
      responses:
        '201':
          description: Обзвон создан (до 5000 номеров).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutocallDetail' }
        '202':
          description: Обзвон принят в обработку (более 5000 номеров, создаётся в фоне).
        '401': { $ref: '#/components/responses/401' }
        '403':
          description: Обзвон отклонён из-за подозрения в спаме (слишком много номеров с короткой аудиозаписью).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
        '422': { $ref: '#/components/responses/422' }
        '429': { $ref: '#/components/responses/429' }

  /autocalls/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
        description: ID обзвона
    get:
      summary: Показать обзвон
      operationId: get-autocalls-id
      tags: [Обзвоны]
      description: |
        Возвращает детальную информацию об обзвоне, включая статистику и постраничный список всех звонков.

        #### Статусы звонков
        | Статус | Значение | Окончательный |
        |--------|----------|---------------|
        | `in_queue` | в очереди | нет |
        | `success` | успешно | да |
        | `recalled` | перезвонил сам | да |
        | `no_answer` | нет ответа | да |
        | `busy` | занято | да |
        | `error` | не существует | да |
        | `spam` | пожаловался на спам | да |
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Детальный объект обзвона со статистикой и звонками.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutocallDetail' }
        '401': { $ref: '#/components/responses/401' }
        '404': { $ref: '#/components/responses/404' }
        '429': { $ref: '#/components/responses/429' }
    put:
      summary: Редактировать обзвон
      operationId: put-autocalls-id
      tags: [Обзвоны]
      description: |
        Изменяет параметры обзвона. Доступно только для обзвонов в статусах `awaiting` и `moderation`.
        Редактируются только перечисленные ниже поля.
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 40 }
                time_from: { type: string, minLength: 8, maxLength: 8 }
                time_to: { type: string, minLength: 8, maxLength: 8 }
                tries_interval:
                  type: integer
                  enum: [15, 30, 60, 120]
                date_from: { type: string, minLength: 10, maxLength: 10 }
                client_id: { type: string, maxLength: 60 }
                callback_url: { type: string, maxLength: 256 }
      responses:
        '200':
          description: Обновлённый объект обзвона.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutocallDetail' }
        '401': { $ref: '#/components/responses/401' }
        '404': { $ref: '#/components/responses/404' }
        '422': { $ref: '#/components/responses/422' }
        '429': { $ref: '#/components/responses/429' }
        '500': { $ref: '#/components/responses/500' }
    delete:
      summary: Удалить обзвон
      operationId: delete-autocalls-id
      tags: [Обзвоны]
      description: Удаляет обзвон. Нельзя удалить обзвон в статусе `running`.
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      responses:
        '204':
          description: Обзвон удалён.
        '401': { $ref: '#/components/responses/401' }
        '404': { $ref: '#/components/responses/404' }
        '422': { $ref: '#/components/responses/422' }
        '429': { $ref: '#/components/responses/429' }
        '500': { $ref: '#/components/responses/500' }

  /autocalls/calculate:
    post:
      summary: Узнать стоимость обзвона
      operationId: post-autocalls-calculate
      tags: [Обзвоны]
      description: Рассчитывает максимальную стоимость обзвона до его создания. Принимает те же параметры, что и создание обзвона.
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AutocallCreate' }
      responses:
        '201':
          description: Максимальная стоимость обзвона.
          content:
            application/json:
              schema:
                type: object
                required: [max_cost]
                properties:
                  max_cost: { type: number }
              example:
                max_cost: 245.60
        '401': { $ref: '#/components/responses/401' }
        '403':
          description: Обзвон отклонён из-за подозрения в спаме.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
        '422': { $ref: '#/components/responses/422' }
        '429': { $ref: '#/components/responses/429' }

  /autocalls/relaunch/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
        description: ID завершённого обзвона
    get:
      summary: Перезапустить обзвон
      operationId: get-autocalls-relaunch-id
      tags: [Обзвоны]
      description: |
        Создаёт новый список контактов из номеров завершённого обзвона, которые **не были успешно обзвонены**.
        Удобно для повторного обзвона недозвонившихся.
        Работает только для обзвонов со статусом `completed`.
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      responses:
        '201':
          description: Новый список контактов создан.
          content:
            application/json:
              schema:
                type: object
                required: [id, name, updated_at, created_at, used, contacts_count, importing]
                properties:
                  id: { type: integer, description: ID нового списка }
                  name: { type: string }
                  created_at: { type: string }
                  updated_at: { type: string }
                  used: { type: integer }
                  contacts_count: { type: integer }
                  importing: { type: boolean }
        '401': { $ref: '#/components/responses/401' }
        '403':
          description: Обзвон ещё не завершён.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
        '404': { $ref: '#/components/responses/404' }
        '429': { $ref: '#/components/responses/429' }

  /calls/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
        description: ID звонка
    get:
      summary: Показать звонок
      operationId: get-calls-id
      tags: [Обзвоны]
      description: Возвращает детальную информацию о конкретном звонке по его ID.
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      responses:
        '200':
          description: Объект звонка.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Call' }
        '401': { $ref: '#/components/responses/401' }
        '404': { $ref: '#/components/responses/404' }
        '429': { $ref: '#/components/responses/429' }

  /calls/recordings/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
        description: ID звонка
    get:
      summary: Скачать запись разговора
      operationId: get-calls-recordings-id
      tags: [Обзвоны]
      description: |
        Возвращает аудиофайл записи разговора для указанного звонка.
        Записи доступны только если при создании обзвона был указан параметр `record: true`.
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      responses:
        '200':
          description: Аудиофайл записи разговора (бинарный контент).
        '401': { $ref: '#/components/responses/401' }
        '404': { $ref: '#/components/responses/404' }
        '429': { $ref: '#/components/responses/429' }

  /calls/{id}/transcript:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
        description: ID звонка
    get:
      summary: Расшифровка разговора
      operationId: get-calls-id-transcript
      tags: [Обзвоны]
      description: |
        Возвращает диалог абонента с ИИ-агентом — то же, что видно в личном кабинете.

        Доступна только для обзвонов типа `agent` и **не зависит** от параметра `record`:
        расшифровка снимается из разговора напрямую, а не из аудиозаписи. Для обычных и
        интерактивных обзвонов вернётся пустой `transcript`.

        Расшифровка появляется после завершения разговора и в течение нескольких секунд
        после него может уточняться (автоматическая правка коротких реплик абонента).
        Если забираете её по вебхуку — берите с небольшой задержкой либо перечитывайте.
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      responses:
        '200':
          description: Расшифровка разговора.
          content:
            application/json:
              schema:
                type: object
                properties:
                  call_id: { type: integer }
                  number: { type: string, description: Номер абонента }
                  transcript:
                    type: array
                    description: Реплики в порядке разговора.
                    items:
                      type: object
                      properties:
                        role:
                          type: string
                          enum: [agent, customer, system]
                          description: "`agent` — ИИ-агент, `customer` — абонент, `system` — пометка сервиса (например, перевод на сотрудника: сам разговор с ним не записывается)"
                        text: { type: string }
                  text:
                    type: string
                    description: Тот же диалог одним текстом, по реплике на строку.
              example:
                call_id: 12345
                number: "+77010000001"
                transcript:
                  - { role: agent, text: "Здравствуйте! Вам удобно говорить?" }
                  - { role: customer, text: "Да, слушаю" }
                text: "Агент: Здравствуйте! Вам удобно говорить?\nАбонент: Да, слушаю"
        '401': { $ref: '#/components/responses/401' }
        '404': { $ref: '#/components/responses/404' }
        '429': { $ref: '#/components/responses/429' }

  # ─────────────────────────────────────────
  # SMS РАССЫЛКИ
  # ─────────────────────────────────────────

  /bulks:
    get:
      summary: Получить все рассылки
      operationId: get-bulks
      tags: [SMS рассылки]
      description: Возвращает все SMS рассылки аккаунта с постраничным выводом.
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/ClientIdFilter'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Постраничный вывод рассылок.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/BulkSummary'
        '401': { $ref: '#/components/responses/401' }
        '429': { $ref: '#/components/responses/429' }

    post:
      summary: Создать рассылку
      operationId: post-bulks
      tags: [SMS рассылки]
      description: |
        Создаёт новую SMS рассылку.
        В `list_id` можно передавать ID существующих списков или объекты с номерами напрямую (максимум 5000).
        Для большего количества — сначала создайте список контактов через `/lists`.

        #### Персонализация через переменные `{{varname}}`
        В тексте рассылки можно использовать переменные контактов вида `{{name}}`, `{{debt}}` и т.п.
        При отправке каждая переменная заменяется на значение из поля `variables` соответствующего контакта.
        Это позволяет отправить персональные сообщения тысячам получателей **одним** запросом.

        Пример текста: `Здравствуйте, {{name}}! Ваш долг {{debt}} тенге. Оплатите!`

        Переменные берутся из контактов, у которых они заданы — либо в существующем списке
        (см. `POST /lists` и `POST /lists/append/{id}`), либо в объектах номеров, переданных в `list_id` напрямую.
        Неизвестная переменная (для которой у контакта нет значения) заменяется на пустую строку.

        > ⚠️ Стоимость и количество SMS-сегментов рассчитываются по «худшему случаю» — берётся
        > самое длинное значение каждой переменной среди всех контактов. Помните, что кириллица
        > использует Unicode-кодировку (до 70 символов в сегменте против 160 для латиницы).
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      requestBody:
        required: true
        description: Параметры рассылки.
        content:
          application/json:
            schema:
              type: object
              required: [name, text, list_id]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 40
                  description: Название рассылки
                text:
                  type: string
                  minLength: 1
                  maxLength: 1600
                  description: |
                    Текст SMS сообщения. Поддерживает переменные вида `{{varname}}`, которые
                    заменяются на значения из поля `variables` каждого контакта.
                    Например: `Здравствуйте, {{name}}! Ваш долг {{debt}} тенге.`
                list_id:
                  type: array
                  minItems: 1
                  maxItems: 5000
                  description: ID списков контактов и/или объекты с номерами
                  items:
                    oneOf:
                      - type: integer
                        description: ID существующего списка
                      - type: object
                        required: [number]
                        properties:
                          number: { type: string, minLength: 12, maxLength: 12 }
                          extra: { type: string, maxLength: 60 }
                          variables:
                            type: object
                            description: |
                              Переменные контакта для подстановки в текст через `{{varname}}`.
                              Ключи — `[a-zA-Z0-9_]` (до 30 символов), значения — строки (до 255 символов).
                            additionalProperties: { type: string }
                            example: { name: "Иван", debt: "15000" }
                date_from:
                  type: string
                  minLength: 10
                  maxLength: 10
                  description: "День запуска в формате Y-m-d (по умолчанию: сегодня)"
                time_from:
                  type: string
                  minLength: 8
                  maxLength: 8
                  description: "Время запуска в формате H:i:s (по умолчанию: сейчас)"
                client_id:
                  type: string
                  maxLength: 60
                  description: ID в Вашей системе
                callback_url:
                  type: string
                  maxLength: 256
                  description: URL для доставки отчётов о рассылке и сообщениях
            examples:
              Отправка OTP:
                summary: Одноразовый код по SMS — одним запросом, без создания списка
                description: |
                  Один запрос — один код на один номер. Номер передаётся прямо в `list_id`,
                  создавать список заранее не нужно. `time_from` не указывайте — сообщение уйдёт
                  сразу.

                  **Модерация.** Первая такая рассылка уйдёт на проверку. Модератор может одобрить
                  все будущие коды с той же формулировкой — после этого OTP уходят без ожидания.
                  Для этого вокруг кода нужна постоянная фраза («Ваш код подтверждения…»): текст
                  из одних цифр одобрить «формой» нельзя.

                  ⚠️ Код пишите прямо в `text`, а НЕ через переменные `{{code}}`. Текст с
                  переменными проверяется заново при каждой отправке — OTP будет ждать модератора
                  каждый раз.

                  ⚠️ Отправка идёт в пределах окна вашего тарифа (`time_from`–`time_to` в
                  профиле). Вне окна сообщение сразу не уйдёт — для OTP это критично, проверьте
                  окно заранее.
                value:
                  name: "OTP"
                  text: "Ваш код подтверждения: 3075. Никому его не сообщайте."
                  list_id:
                    - number: "+77010000000"
                  callback_url: "https://example.com/otp-status"
              Простая рассылка:
                value:
                  name: "Акция — ноябрь"
                  text: "Скидка 20% только сегодня! Промокод: SALE20"
                  list_id: [10, 15]
                  time_from: "10:00:00"
                  callback_url: "https://example.com/sms-reports"
              Без создания списка — номера прямо в запросе:
                summary: Создавать список контактов заранее НЕ нужно — передайте номера в list_id
                description: |
                  Не обязательно сначала вызывать `POST /lists`. Можно передать номера
                  напрямую в `list_id` как массив объектов `{ "number": "+7..." }` —
                  система сама создаст временный список. Удобно для разовых рассылок.
                value:
                  name: "Акция — ноябрь"
                  text: "Скидка 20% только сегодня! Промокод: SALE20"
                  list_id:
                    - number: "+77010000001"
                    - number: "+77010000002"
                    - number: "+77010000003"
              Персональная рассылка по существующему списку:
                summary: Текст с переменными, контакты берутся из списка
                value:
                  name: "Напоминание о долге"
                  text: "Здравствуйте, {{name}}! Ваш долг {{debt}} тенге. Оплатите до конца месяца."
                  list_id: [10]
              Персональная рассылка одним запросом:
                summary: Переменные и номера передаются прямо в запросе
                value:
                  name: "Напоминание о долге"
                  text: "Здравствуйте, {{name}}! Ваш долг {{debt}} тенге. Оплатите до конца месяца."
                  list_id:
                    - number: "+77010000001"
                      variables: { name: "Иван", debt: "15000" }
                    - number: "+77010000002"
                      variables: { name: "Пётр", debt: "3200" }
      responses:
        '201':
          description: Рассылка создана.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkDetail' }
        '401': { $ref: '#/components/responses/401' }
        '422': { $ref: '#/components/responses/422' }
        '429': { $ref: '#/components/responses/429' }
        '500': { $ref: '#/components/responses/500' }

  /bulks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
        description: ID рассылки
    get:
      summary: Показать рассылку
      operationId: get-bulks-id
      tags: [SMS рассылки]
      description: Возвращает детальную информацию о рассылке и постраничный список всех сообщений.
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
