          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScenarioDetail' }
        '401': { $ref: '#/components/responses/401' }
        '404': { $ref: '#/components/responses/404' }
        '429': { $ref: '#/components/responses/429' }
    put:
      summary: Редактировать сценарий
      operationId: put-scenarios-id
      tags: [Сценарии]
      description: Изменяет название, структуру или client_id сценария.
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 40 }
                data: { type: string }
                client_id: { type: string, maxLength: 60 }
      responses:
        '200':
          description: Обновлённый объект сценария.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScenarioDetail' }
        '401': { $ref: '#/components/responses/401' }
        '404': { $ref: '#/components/responses/404' }
        '422': { $ref: '#/components/responses/422' }
        '429': { $ref: '#/components/responses/429' }
        '500': { $ref: '#/components/responses/500' }
    delete:
      summary: Удалить сценарий
      operationId: delete-scenarios-id
      tags: [Сценарии]
      description: Удаляет сценарий из аккаунта.
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      responses:
        '204':
          description: Сценарий удалён.
        '401': { $ref: '#/components/responses/401' }
        '404': { $ref: '#/components/responses/404' }
        '422': { $ref: '#/components/responses/422' }
        '429': { $ref: '#/components/responses/429' }
        '500': { $ref: '#/components/responses/500' }

  # ─────────────────────────────────────────
  # ОБЗВОНЫ
  # ─────────────────────────────────────────

  /autocalls:
    get:
      summary: Получить все обзвоны
      operationId: get-autocalls
      tags: [Обзвоны]
      description: |
        Возвращает все обзвоны аккаунта с постраничным выводом.

        #### Статусы обзвонов
        | Статус | Значение | Окончательный |
        |--------|----------|---------------|
        | `running` | выполняется | нет |
        | `completed` | завершён успешно | да |
        | `awaiting` | ожидает своего времени | нет |
        | `moderation` | на модерации | нет |
        | `denied` | запрещён модераторами | да |
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/ClientIdFilter'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Постраничный вывод обзвонов.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AutocallSummary'
        '401': { $ref: '#/components/responses/401' }
        '429': { $ref: '#/components/responses/429' }

    post:
      summary: Создать обзвон
      operationId: post-autocalls
      tags: [Обзвоны]
      description: |
        Создаёт новый обзвон. Поддерживает два типа:
        - `regular` — обычный обзвон с аудиозаписью
        - `interactive` — интерактивный обзвон по сценарию

        В `list_id` можно передавать как ID существующих списков, так и объекты с номерами напрямую (будет создан автоматический список).
        В `audio_id` можно передавать как ID существующих аудиозаписей, так и объекты для создания новых (синтез или загрузка).

        Если общее количество номеров ≤ 5000 — ответ `201` (создан сразу).
        Если > 5000 — ответ `202` (создаётся в фоне).
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      requestBody:
        required: true
        description: Параметры нового обзвона.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutocallCreate'
            examples:
              Обычный обзвон:
                value:
                  name: "Уведомление об акции"
                  type: regular
                  time_from: "10:00:00"
                  time_to: "20:00:00"
                  audio_id: [5]
                  list_id: [10]
              Интерактивный обзвон:
                value:
                  name: "Опрос удовлетворённости"
                  type: interactive
                  time_from: "10:00:00"
                  time_to: "18:00:00"
                  scenario_id: 512
                  list_id: [15]
                  max_tries: 3
                  tries_interval: 60
                  record: true
                  callback_url: "https://example.com/reports"
              С новыми номерами и синтезом:
                value:
                  name: "Код подтверждения"
                  type: regular
                  time_from: "00:00:00"
                  time_to: "23:59:59"
                  audio_id:
                    - type: synthesis
                      data:
                        text: "Ваш код подтверждения: 3, 0, 7, 5."
                  list_id:
                    - number: "+77010000000"
                  sms_unanswered: true
                  text_unanswered: "Ваш код: 3075"
              С персональными SMS недозвонившимся:
                summary: Переменные подставляются в SMS для тех, кто не ответил
                value:
                  name: "Напоминание о записи"
                  type: regular
                  time_from: "10:00:00"
                  time_to: "20:00:00"
                  audio_id: [5]
                  list_id:
                    - number: "+77010000001"
                      variables: { name: "Иван", time: "14:30" }
                    - number: "+77010000002"
                      variables: { name: "Пётр", time: "16:00" }
                  sms_unanswered: true
                  text_unanswered: "{{name}}, мы не дозвонились. Ждём вас в {{time}}."
      responses:
        '201':
          description: Обзвон создан (до 5000 номеров).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutocallDetail' }
        '202':
          description: Обзвон принят в обработку (более 5000 номеров, создаётся в фоне).
        '401': { $ref: '#/components/responses/401' }
        '403':
          description: Обзвон отклонён из-за подозрения в спаме (слишком много номеров с короткой аудиозаписью).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
        '422': { $ref: '#/components/responses/422' }
        '429': { $ref: '#/components/responses/429' }

  /autocalls/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
        description: ID обзвона
    get:
      summary: Показать обзвон
      operationId: get-autocalls-id
      tags: [Обзвоны]
      description: |
        Возвращает детальную информацию об обзвоне, включая статистику и постраничный список всех звонков.

        #### Статусы звонков
        | Статус | Значение | Окончательный |
        |--------|----------|---------------|
        | `in_queue` | в очереди | нет |
        | `success` | успешно | да |
        | `recalled` | перезвонил сам | да |
        | `no_answer` | нет ответа | да |
        | `busy` | занято | да |
        | `error` | не существует | да |
        | `spam` | пожаловался на спам | да |
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Детальный объект обзвона со статистикой и звонками.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutocallDetail' }
        '401': { $ref: '#/components/responses/401' }
        '404': { $ref: '#/components/responses/404' }
        '429': { $ref: '#/components/responses/429' }
    put:
      summary: Редактировать обзвон
      operationId: put-autocalls-id
      tags: [Обзвоны]
      description: |
        Изменяет параметры обзвона. Доступно только для обзвонов в статусах `awaiting` и `moderation`.
        Редактируются только перечисленные ниже поля.
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 40 }
                time_from: { type: string, minLength: 8, maxLength: 8 }
                time_to: { type: string, minLength: 8, maxLength: 8 }
                tries_interval:
                  type: integer
                  enum: [15, 30, 60, 120]
                date_from: { type: string, minLength: 10, maxLength: 10 }
                client_id: { type: string, maxLength: 60 }
                callback_url: { type: string, maxLength: 256 }
      responses:
        '200':
          description: Обновлённый объект обзвона.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutocallDetail' }
        '401': { $ref: '#/components/responses/401' }
        '404': { $ref: '#/components/responses/404' }
        '422': { $ref: '#/components/responses/422' }
        '429': { $ref: '#/components/responses/429' }
        '500': { $ref: '#/components/responses/500' }
    delete:
      summary: Удалить обзвон
      operationId: delete-autocalls-id
      tags: [Обзвоны]
      description: Удаляет обзвон. Нельзя удалить обзвон в статусе `running`.
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      responses:
        '204':
          description: Обзвон удалён.
        '401': { $ref: '#/components/responses/401' }
        '404': { $ref: '#/components/responses/404' }
        '422': { $ref: '#/components/responses/422' }
        '429': { $ref: '#/components/responses/429' }
        '500': { $ref: '#/components/responses/500' }

  /autocalls/calculate:
    post:
      summary: Узнать стоимость обзвона
      operationId: post-autocalls-calculate
      tags: [Обзвоны]
      description: Рассчитывает максимальную стоимость обзвона до его создания. Принимает те же параметры, что и создание обзвона.
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AutocallCreate' }
      responses:
        '201':
          description: Максимальная стоимость обзвона.
          content:
            application/json:
              schema:
                type: object
                required: [max_cost]
                properties:
                  max_cost: { type: number }
              example:
                max_cost: 245.60
        '401': { $ref: '#/components/responses/401' }
        '403':
          description: Обзвон отклонён из-за подозрения в спаме.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
        '422': { $ref: '#/components/responses/422' }
        '429': { $ref: '#/components/responses/429' }

  /autocalls/relaunch/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
        description: ID завершённого обзвона
    get:
      summary: Перезапустить обзвон
      operationId: get-autocalls-relaunch-id
      tags: [Обзвоны]
      description: |
        Создаёт новый список контактов из номеров завершённого обзвона, которые **не были успешно обзвонены**.
        Удобно для повторного обзвона недозвонившихся.
        Работает только для обзвонов со статусом `completed`.
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      responses:
        '201':
          description: Новый список контактов создан.
          content:
            application/json:
              schema:
                type: object
                required: [id, name, updated_at, created_at, used, contacts_count, importing]
                properties:
                  id: { type: integer, description: ID нового списка }
                  name: { type: string }
                  created_at: { type: string }
                  updated_at: { type: string }
                  used: { type: integer }
                  contacts_count: { type: integer }
                  importing: { type: boolean }
        '401': { $ref: '#/components/responses/401' }
        '403':
          description: Обзвон ещё не завершён.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
        '404': { $ref: '#/components/responses/404' }
        '429': { $ref: '#/components/responses/429' }

  /calls/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
        description: ID звонка
    get:
      summary: Показать звонок
      operationId: get-calls-id
      tags: [Обзвоны]
      description: Возвращает детальную информацию о конкретном звонке по его ID.
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      responses:
        '200':
          description: Объект звонка.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Call' }
        '401': { $ref: '#/components/responses/401' }
        '404': { $ref: '#/components/responses/404' }
        '429': { $ref: '#/components/responses/429' }

  /calls/recordings/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
        description: ID звонка
    get:
      summary: Скачать запись разговора
      operationId: get-calls-recordings-id
      tags: [Обзвоны]
      description: |
        Возвращает аудиофайл записи разговора для указанного звонка.
        Записи доступны только если при создании обзвона был указан параметр `record: true`.
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      responses:
        '200':
          description: Аудиофайл записи разговора (бинарный контент).
        '401': { $ref: '#/components/responses/401' }
        '404': { $ref: '#/components/responses/404' }
        '429': { $ref: '#/components/responses/429' }

  # ─────────────────────────────────────────
  # SMS РАССЫЛКИ
  # ─────────────────────────────────────────

  /bulks:
    get:
      summary: Получить все рассылки
      operationId: get-bulks
      tags: [SMS рассылки]
      description: Возвращает все SMS рассылки аккаунта с постраничным выводом.
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/ClientIdFilter'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Постраничный вывод рассылок.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/BulkSummary'
        '401': { $ref: '#/components/responses/401' }
        '429': { $ref: '#/components/responses/429' }

    post:
      summary: Создать рассылку
      operationId: post-bulks
      tags: [SMS рассылки]
      description: |
        Создаёт новую SMS рассылку.
        В `list_id` можно передавать ID существующих списков или объекты с номерами напрямую (максимум 5000).
        Для большего количества — сначала создайте список контактов через `/lists`.

        #### Персонализация через переменные `{{varname}}`
        В тексте рассылки можно использовать переменные контактов вида `{{name}}`, `{{debt}}` и т.п.
        При отправке каждая переменная заменяется на значение из поля `variables` соответствующего контакта.
        Это позволяет отправить персональные сообщения тысячам получателей **одним** запросом.

        Пример текста: `Здравствуйте, {{name}}! Ваш долг {{debt}} тенге. Оплатите!`

        Переменные берутся из контактов, у которых они заданы — либо в существующем списке
        (см. `POST /lists` и `POST /lists/append/{id}`), либо в объектах номеров, переданных в `list_id` напрямую.
        Неизвестная переменная (для которой у контакта нет значения) заменяется на пустую строку.

        > ⚠️ Стоимость и количество SMS-сегментов рассчитываются по «худшему случаю» — берётся
        > самое длинное значение каждой переменной среди всех контактов. Помните, что кириллица
        > использует Unicode-кодировку (до 70 символов в сегменте против 160 для латиницы).
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      requestBody:
        required: true
        description: Параметры рассылки.
        content:
          application/json:
            schema:
              type: object
              required: [name, text, list_id]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 40
                  description: Название рассылки
                text:
                  type: string
                  minLength: 1
                  maxLength: 1600
                  description: |
                    Текст SMS сообщения. Поддерживает переменные вида `{{varname}}`, которые
                    заменяются на значения из поля `variables` каждого контакта.
                    Например: `Здравствуйте, {{name}}! Ваш долг {{debt}} тенге.`
                list_id:
                  type: array
                  minItems: 1
                  maxItems: 5000
                  description: ID списков контактов и/или объекты с номерами
                  items:
                    oneOf:
                      - type: integer
                        description: ID существующего списка
                      - type: object
                        required: [number]
                        properties:
                          number: { type: string, minLength: 12, maxLength: 12 }
                          extra: { type: string, maxLength: 60 }
                          variables:
                            type: object
                            description: |
                              Переменные контакта для подстановки в текст через `{{varname}}`.
                              Ключи — `[a-zA-Z0-9_]` (до 30 символов), значения — строки (до 255 символов).
                            additionalProperties: { type: string }
                            example: { name: "Иван", debt: "15000" }
                date_from:
                  type: string
                  minLength: 10
                  maxLength: 10
                  description: "День запуска в формате Y-m-d (по умолчанию: сегодня)"
                time_from:
                  type: string
                  minLength: 8
                  maxLength: 8
                  description: "Время запуска в формате H:i:s (по умолчанию: сейчас)"
                client_id:
                  type: string
                  maxLength: 60
                  description: ID в Вашей системе
                callback_url:
                  type: string
                  maxLength: 256
                  description: URL для доставки отчётов о рассылке и сообщениях
            examples:
              Простая рассылка:
                value:
                  name: "Акция — ноябрь"
                  text: "Скидка 20% только сегодня! Промокод: SALE20"
                  list_id: [10, 15]
                  time_from: "10:00:00"
                  callback_url: "https://example.com/sms-reports"
              Персональная рассылка по существующему списку:
                summary: Текст с переменными, контакты берутся из списка
                value:
                  name: "Напоминание о долге"
                  text: "Здравствуйте, {{name}}! Ваш долг {{debt}} тенге. Оплатите до конца месяца."
                  list_id: [10]
              Персональная рассылка одним запросом:
                summary: Переменные и номера передаются прямо в запросе
                value:
                  name: "Напоминание о долге"
                  text: "Здравствуйте, {{name}}! Ваш долг {{debt}} тенге. Оплатите до конца месяца."
                  list_id:
                    - number: "+77010000001"
                      variables: { name: "Иван", debt: "15000" }
                    - number: "+77010000002"
                      variables: { name: "Пётр", debt: "3200" }
      responses:
        '201':
          description: Рассылка создана.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkDetail' }
        '401': { $ref: '#/components/responses/401' }
        '422': { $ref: '#/components/responses/422' }
        '429': { $ref: '#/components/responses/429' }
        '500': { $ref: '#/components/responses/500' }

  /bulks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
        description: ID рассылки
    get:
      summary: Показать рассылку
      operationId: get-bulks-id
      tags: [SMS рассылки]
      description: Возвращает детальную информацию о рассылке и постраничный список всех сообщений.
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Детальный объект рассылки.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkDetail' }
        '401': { $ref: '#/components/responses/401' }
        '404': { $ref: '#/components/responses/404' }
        '429': { $ref: '#/components/responses/429' }
    put:
      summary: Редактировать рассылку
      operationId: put-bulks-id
      tags: [SMS рассылки]
      description: Изменяет параметры рассылки. Доступно только для рассылок в статусах `awaiting` и `moderation`.
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 40 }
                time_from: { type: string, minLength: 8, maxLength: 8 }
                date_from: { type: string, minLength: 10, maxLength: 10 }
                client_id: { type: string, maxLength: 60 }
                callback_url: { type: string, maxLength: 256 }
      responses:
        '200':
          description: Обновлённый объект рассылки.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkDetail' }
        '401': { $ref: '#/components/responses/401' }
        '404': { $ref: '#/components/responses/404' }
        '422': { $ref: '#/components/responses/422' }
        '429': { $ref: '#/components/responses/429' }
        '500': { $ref: '#/components/responses/500' }
    delete:
      summary: Удалить рассылку
      operationId: delete-bulks-id
      tags: [SMS рассылки]
      description: Удаляет рассылку. Нельзя удалить рассылку в статусе `running`.
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      responses:
        '204':
          description: Рассылка удалена.
        '401': { $ref: '#/components/responses/401' }
        '404': { $ref: '#/components/responses/404' }
        '422': { $ref: '#/components/responses/422' }
        '429': { $ref: '#/components/responses/429' }
        '500': { $ref: '#/components/responses/500' }

  /bulks/calculate:
    post:
      summary: Узнать стоимость рассылки
      operationId: post-bulks-calculate
      tags: [SMS рассылки]
      description: Рассчитывает максимальную стоимость рассылки до её создания. Принимает те же параметры, что и создание рассылки.
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, text, list_id]
              properties:
                name: { type: string, minLength: 1, maxLength: 40 }
                text:
                  type: string
                  minLength: 1
                  maxLength: 1600
                  description: |
                    Текст SMS. Поддерживает переменные `{{varname}}`. Стоимость рассчитывается
                    по «худшему случаю» — берётся самое длинное значение каждой переменной.
                list_id:
                  type: array
                  minItems: 1
                  maxItems: 6000
                  items:
                    oneOf:
                      - type: integer
                      - type: object
                        required: [number]
                        properties:
                          number: { type: string, minLength: 12, maxLength: 12 }
                          extra: { type: string, maxLength: 60 }
                          variables:
                            type: object
                            additionalProperties: { type: string }
                            description: Переменные контакта для подстановки в текст через `{{varname}}`.
                date_from: { type: string, minLength: 10, maxLength: 10 }
                time_from: { type: string, minLength: 8, maxLength: 8 }
                client_id: { type: string, maxLength: 60 }
                callback_url: { type: string, maxLength: 256 }
      responses:
        '201':
          description: Максимальная стоимость рассылки.
          content:
            application/json:
              schema:
                type: object
                properties:
                  max_cost: { type: number }
              example:
                max_cost: 120.00
        '401': { $ref: '#/components/responses/401' }
        '422': { $ref: '#/components/responses/422' }
        '429': { $ref: '#/components/responses/429' }
        '500': { $ref: '#/components/responses/500' }

  /messages/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: ID сообщения
    get:
      summary: Показать сообщение
      operationId: get-messages-id
      tags: [SMS рассылки]
      description: Возвращает детальную информацию о конкретном SMS сообщении.
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      responses:
        '200':
          description: Объект сообщения.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '401': { $ref: '#/components/responses/401' }
        '404': { $ref: '#/components/responses/404' }
        '429': { $ref: '#/components/responses/429' }

  # ─────────────────────────────────────────
  # НАСТРОЙКИ
  # ─────────────────────────────────────────

  /settings:
    get:
      summary: Получить настройки аккаунта
      operationId: get-settings
      tags: [Настройки]
      description: Возвращает текущие настройки аккаунта, тарифы, подтверждённые номера и общую статистику.
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      responses:
        '200':
          description: Объект с настройками аккаунта.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountSettings' }
        '401': { $ref: '#/components/responses/401' }
        '429': { $ref: '#/components/responses/429' }

    put:
      summary: Редактировать настройки
      operationId: put-settings
      tags: [Настройки]
      description: Изменяет имя, подписки и визитную карточку аккаунта.
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      requestBody:
        description: Отправьте только те поля, которые нужно изменить.
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 40
                  description: Имя пользователя
                subscribe:
                  type: boolean
                  description: Подписка на новости через звонки
                notifications_subscribe:
                  type: boolean
                  description: Дублирование уведомлений через SMS
                visit_card_audio:
                  type: integer
                  description: ID аудиозаписи для визитной карточки
                visit_card_text:
                  type: string
                  maxLength: 160
                  description: Текст SMS визитной карточки (до 1 SMS)
            example:
              name: "Жандос"
              subscribe: true
              notifications_subscribe: false
              visit_card_text: "Компания AutoCall.kz, тел: +77470000000"
      responses:
        '200':
          description: Обновлённые настройки аккаунта.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountSettings' }
        '401': { $ref: '#/components/responses/401' }
        '422': { $ref: '#/components/responses/422' }
        '429': { $ref: '#/components/responses/429' }
        '500': { $ref: '#/components/responses/500' }

  /settings/{visit_card_type}:
    parameters:
      - name: visit_card_type
        in: path
        required: true
        schema:
          type: string
          enum: [visit_card_audio, visit_card_text]
        description: Тип визитной карточки
    delete:
      summary: Удалить визитную карточку
      operationId: delete-settings-visit-card
      tags: [Настройки]
      description: Удаляет аудио или текстовую визитную карточку аккаунта.
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      responses:
        '204':
          description: Визитная карточка удалена.
        '401': { $ref: '#/components/responses/401' }
        '422': { $ref: '#/components/responses/422' }
        '429': { $ref: '#/components/responses/429' }
        '500': { $ref: '#/components/responses/500' }

  /settings/confirmed_numbers:
    get:
      summary: Получить подтверждённые номера
      operationId: get-settings-confirmed-numbers
      tags: [Настройки]
      description: Возвращает все номера телефонов, добавленные в аккаунт.
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      responses:
        '200':
          description: Массив с номерами.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConfirmedNumber'
              example:
                - id: 1
                  number: "+77010000001"
                  verified_at: "2019-12-08 23:46:06"
                  created_at: "2019-12-08 23:46:06"
                  updated_at: "2019-12-08 23:46:06"
                - id: 3
                  number: "+77010000002"
                  verified_at: null
                  created_at: "2024-03-19 17:10:27"
                  updated_at: "2024-03-19 17:10:27"
        '401': { $ref: '#/components/responses/401' }
        '429': { $ref: '#/components/responses/429' }

    post:
      summary: Добавить или подтвердить номер
      operationId: post-settings-confirmed-numbers
      tags: [Настройки]
      description: |
        Двухшаговый процесс:
        1. Отправьте `number` — система позвонит на этот номер, последние 5 цифр номера звонящего = код подтверждения
        2. Отправьте `verification_code` — номер будет подтверждён

        Неподтверждённые номера удаляются автоматически через 10 минут.
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                number:
                  type: string
                  minLength: 12
                  maxLength: 12
                  pattern: '^\+7(700|701|702|705|707|708|747|771|775|776|777|778)\d{7}$'
                  example: "+77020000001"
                  description: Номер для добавления (шаг 1)
                verification_code:
                  type: integer
                  minimum: 10000
                  maximum: 99999
                  description: Код подтверждения из последних 5 цифр входящего звонка (шаг 2)
            examples:
              Шаг 1 — добавить номер:
                value:
                  number: "+77020000001"
              Шаг 2 — подтвердить:
                value:
                  verification_code: 30756
      responses:
        '201':
          description: Номер добавлен (шаг 1) или подтверждён (шаг 2).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfirmedNumber' }
        '401': { $ref: '#/components/responses/401' }
        '422': { $ref: '#/components/responses/422' }
        '429': { $ref: '#/components/responses/429' }
        '500': { $ref: '#/components/responses/500' }

  # ─────────────────────────────────────────
