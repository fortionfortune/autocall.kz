            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 40
                  description: Имя пользователя
                subscribe:
                  type: boolean
                  description: Подписка на новости через звонки
                notifications_subscribe:
                  type: boolean
                  description: Дублирование уведомлений через SMS
                visit_card_audio:
                  type: integer
                  description: ID аудиозаписи для визитной карточки
                visit_card_text:
                  type: string
