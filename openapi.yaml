openapi: 3.1.0

info:
  title: AutoCall.kz API
  version: "1.0"
  description: |
    REST API сервиса автообзвона AutoCall.kz.

    ## Публичный API
    Эндпоинты `/api/public/*` доступны без аутентификации — тарифы и тестовый звонок.

    ## API v1 (авторизованный)
    Все эндпоинты `/api/v1/*` требуют заголовок:
    ```
    Authorization: Bearer ВАШ_API_КЛЮЧ
    ```
    API-ключи создаются в разделе **API** личного кабинета autocall.kz. Ключей может быть
    несколько — например, отдельный для каждого проекта. Каждому ключу можно ограничить права
    (какие методы API ему доступны) и список IP-адресов, с которых он принимается.

    ## Лимиты
    Ограничений два, и они независимы — сработает то, до которого дойдёте раньше.

    | Уровень | Лимит | На что считается |
    |---------|-------|------------------|
    | Приложение | **300 запросов в минуту** | на ваш API-ключ |
    | Сервер | **15 запросов в секунду**, всплеск до 30 | на IP-адрес |

    Оба отвечают статусом `429`. Лимит приложения возвращает JSON с полем `message`;
    серверный отдаёт короткую HTML-страницу — на него не стоит рассчитывать как на
    предсказуемый ответ, это защита от флуда.

    Отдельно ограничено число **одновременных** соединений с одного адреса — 20.

    ### Как не упираться

    - Держите не больше 10–15 запросов в секунду и делайте паузу при `429`,
      желательно с экспоненциальной выдержкой.
    - Не открывайте десятки параллельных соединений: последовательные запросы в
      2–3 потока быстрее, чем 20 потоков, половина которых получает `429`.
    - Систематическое превышение серверного лимита может привести к временной
      блокировке адреса. Если ваша интеграция требует большего — напишите в
      поддержку, лимит поднимут точечно.

    Для увеличения лимита приложения обратитесь в поддержку.

    ## Вебхуки (`callback_url`)

    Адрес приёмника задаётся двумя способами:

    - **Глобально** — в личном кабинете, **Настройки → API**, поле «Адрес для вебхуков».
      Применяется ко всем обзвонам, рассылкам и Flash Call аккаунта, включая созданные вручную
      в кабинете.
      Принимается только `https`.
    - **Для конкретного обзвона, рассылки или Flash Call** — поле `callback_url` в теле
      запроса на создание. Оно **перебивает** глобальный адрес: события по этому объекту уйдут только
      на него.

    Если не задано ни то, ни другое — вебхуки не отправляются.

    Мы шлём `POST` с `Content-Type: application/json` по мере изменения объектов:
    `{"call": {...}}` — про звонок, `{"autocall": {...}}` — про обзвон,
    `{"message": {...}}` / `{"bulk": {...}}` — про SMS, `{"flash_call": {...}}` — про Flash Call.

    Что важно учесть при интеграции:

    - **События звонка схлопываются.** Звонок меняется по ходу жизни несколько раз
      (постановка в набор, результат попытки, финализация, распознавание речи,
      расшифровка разговора агента), но отдельный запрос на каждое изменение мы НЕ шлём.
      После каждого изменения запускается пауза в 30 секунд; новое изменение сбрасывает
      её заново. Как только звонок 30 секунд не менялся, уходит один `POST` с его
      состоянием на этот момент.

      Поэтому изменения, идущие подряд, склеиваются в один запрос, а разнесённые во
      времени — нет. Разговор длиннее 30 секунд даст два запроса: сначала о том, что
      звонок начался (`status: calling`), потом о результате. Это ожидаемое поведение,
      а не сбой.
    - **Следствие: данные приходят с задержкой** примерно в полминуты после последнего
      изменения — и уже полными. В частности, у агент-звонков расшифровка разговора
      (`data._transcript`) на этот момент записана и обработана; раньше она могла не
      успеть.
    - **Один объект всё равно может прийти несколько раз.** Схлопываются изменения
      ВНУТРИ одной паузы; между попытками дозвона проходят минуты, поэтому на каждую
      попытку придёт свой запрос. Обрабатывайте вебхуки идемпотентно — по `call.id` /
      `autocall.id`, а не «по факту получения».
    - **События SMS-сообщений схлопываются так же** и по тому же правилу: склеивается
      то, что уложилось в одну паузу. Статус доставки от оператора приходит минутами позже
      отправки, то есть заведомо за пределами паузы: это отдельный запрос, и так и
      задумано — новая информация, а не уточнение прежней.
    - **Flash Call — ровно один запрос** на каждый flash: с окончательным статусом
      (`delivered`, `failed` или `expired`), обычно через 15–30 секунд после `POST`.
      Промежуточные `queued`/`dialing` не отправляются. Формат — как у
      `GET /flash-calls/{id}`.
    - **События обзвона и рассылки не схлопываются.** Переходы `moderation → awaiting →
      running → completed` приходят отдельными запросами: это разные по смыслу
      состояния, разнесённые во времени.
    - **Порядок доставки не гарантирован.** События звонков и события обзвона идут
      независимо, поэтому `autocall.status = completed` может прийти раньше последнего
      события звонка. Ориентируйтесь на содержимое, а не на очерёдность.
    - **Объём.** Обзвон на N номеров с одной попыткой даёт от `4 + N` до `4 + 2 × N`
      запросов: четыре по обзвону и один-два на номер — в зависимости от того, длиннее
      разговор паузы схлопывания или короче. Против прежних `4 + 4 × N` это вдвое-вчетверо
      меньше.
    - **Повторов нет.** Ответ мы не проверяем и при ошибке не повторяем, но соединение
      держим до 10 секунд. Медленный приёмник вредит прежде всего вам: часть событий
      просто не доедет. Отвечайте `200` сразу и обрабатывайте асинхронно.
    - **Редиректы не поддерживаются.** `301`/`302` не выполняются — указывайте сразу
      конечный URL (в частности, `https://`, а не `http://` с редиректом).
    - **Только публичные IPv4-адреса.** Приватные диапазоны и IPv6-only хосты
      недоступны.

    ## Форматы дат
    - Дата: `Y-m-d` (например: `2024-03-15`)
    - Время: `H:i:s` (например: `13:00:00`)
    - Дата + время: `Y-m-d H:i:s`
  contact:
    name: Поддержка AutoCall.kz
    email: info@autocall.kz
    url: https://autocall.kz

servers:
  - url: https://autocall.kz/api/v1
    description: API v1 (требует Bearer токен)

security:
  - bearerAuth: []

tags:
  - name: OTP — коды подтверждения
    description: |
      Три способа доставить одноразовый код: SMS, голосовой звонок и Flash Call.

      Отдельных эндпоинтов у OTP нет — он собирается из уже существующих. Догадаться об этом,
      не зная нашей модели данных, невозможно, поэтому здесь собрано всё, что нужно для
      интеграции: SMS-код — это рассылка на один номер, голосовой код — обзвон одного контакта
      с синтезом речи на лету, Flash Call — звонок, который сбрасывается, и кодом служит хвост
      номера звонящего.

      ## 1. SMS OTP

      `POST /bulks` — рассылка на один номер.

      ```json
      {
        "name": "OTP",
        "text": "Код подтверждения: 2134",
        "list_id": [{ "number": "+77011234567" }]
      }
      ```

      - `name` — до 40 символов, служебное имя рассылки, абоненту НЕ отправляется;
      - `text` — до 1600 символов; тарифицируется посегментно (70 символов кириллицей на сегмент);
      - `list_id` — получатели; для OTP это всегда один номер.

      Статус доставки: `GET /bulks/{id}`.

      ## 2. Voice OTP (голосовой код)

      > ⚠️ **Прекращается с 1 ноября 2026 года.** Согласно п. 3-1 ст. 21 Закона РК «О связи»
      > (в редакции Закона от 19.06.2026 № 320-VIII) с 20 августа 2026 года операторам связи запрещено
      > пропускать автоматические вызовы для передачи кодов идентификации и аутентификации, в том числе
      > прерывающиеся до или после первого гудка. Переведите подтверждение номера на SMS.

      `POST /autocalls` — обзвон одного контакта с синтезом речи.

      ```json
      {
        "name": "Код подтверждения",
        "type": "regular",
        "time_from": "00:00:00",
        "time_to": "23:59:59",
        "audio_id": [{
          "type": "synthesis",
          "data": { "text": "Ваш код подтверждения: 2 1 3 4.", "voice": "Sulafat" }
        }],
        "list_id": [{ "number": "+77011234567" }]
      }
      ```

      ⚠️ **`time_from` и `time_to` обязаны покрывать текущий момент.** Иначе обзвон уйдёт в
      статус `awaiting` и код будет озвучен, когда наступит указанное окно, — то есть завтра.
      Для кодов подтверждения это всегда полные сутки, как в примере.

      💡 **Пишите цифры кода через пробел** (`2 1 3 4`), иначе синтез произнесёт «две тысячи
      сто тридцать четыре».

      Результат звонка: `GET /autocalls/{id}`.

      ## 3. Flash Call OTP

      > ⚠️ **Прекращается с 1 ноября 2026 года.** Согласно п. 3-1 ст. 21 Закона РК «О связи»
      > (в редакции Закона от 19.06.2026 № 320-VIII) с 20 августа 2026 года операторам связи запрещено
      > пропускать автоматические вызовы для передачи кодов идентификации и аутентификации, в том числе
      > прерывающиеся до или после первого гудка. Переведите подтверждение номера на SMS.

      `POST /flash-calls` — звонок, который сбрасывается автоматически. Кодом служат последние
      N цифр номера, с которого пришёл звонок. Для абонента звонок бесплатный.

      ```json
      { "number": "+77011234567", "digits": 4 }
      ```

      - `digits` (3–6) — код генерируем мы. Работает всегда, рекомендуемый режим;
      - `code` — ваш конкретный код; ответ `422`, если свободного номера с таким окончанием
        сейчас нет.

      Ограничение: не более 3 запросов на один номер за 5 минут, дальше `429`.

      Дошёл ли звонок — `GET /flash-calls/{id}` или вебхук с `{"flash_call": {...}}`: `delivered`
      (звонок дошёл до телефона — даже если его сбросили или было занято), `failed` (сеть не
      дотянулась до абонента) или `expired` (не успели набрать за 2 минуты). При `failed` и
      `expired` сразу отправляйте код другим способом, например SMS.

      ## ⚠️ Первый код уходит на проверку

      Это главная причина обращений «ваш API не работает».

      У нового аккаунта первая SMS-рассылка и первый голосовой обзвон попадают на модерацию и
      ждут человека — обычно в пределах рабочего дня. После того как формулировку одобрили,
      коды с тем же текстом отправляются **мгновенно и без проверки**: сам код в шаблоне
      подменяется на «любые 4–6 цифр», поэтому каждый новый код под одобрение уже подходит.

      Отсюда практическое правило: **не меняйте формулировку без нужды** — новый текст
      возвращает проверку. Flash Call модерации не знает вообще, текста в нём нет.

      ## ⚠️ Бренды в тексте

      Упоминание стороннего бренда в SMS проверку не проходит — это требование операторов, а не
      наше. «Код подтверждения: 2134» проходит всегда.

      ## Что выбрать

      | | Скорость | Цена | Когда брать |
      |---|---|---|---|
      | SMS | секунды | дешёвая | по умолчанию |
      | Голос | ~30 секунд | дороже SMS | когда SMS не доходят или нужен звонок |
      | Flash Call | секунды | дешевле SMS | массовая верификация, код не нужно читать вслух |

  - name: Публичный API
    description: Эндпоинты без аутентификации — тарифы и тестовый звонок.
  - name: Списки контактов
    description: Создание и управление списками контактов для обзвонов и рассылок.
  - name: Контакты
    description: Просмотр и удаление отдельных контактов внутри списков.
  - name: Аудиозаписи
    description: Загрузка аудиофайлов и синтез речи для использования в обзвонах.
  - name: Сценарии
    description: |
      Интерактивные сценарии для обзвонов с распознаванием речи, нажатием клавиш и ветвлением логики.

      ## Поле `data` — это JSON, сериализованный в СТРОКУ

      Сценарий передаётся не объектом, а **строкой** с закодированным JSON:
      `json_encode()` в PHP, `JSON.stringify()` в JS, `json.dumps()` в Python.
      Если прислать объект — придёт `422` с текстом
      «Значение поля data должно быть закодированной json строкой».

      ```php
      $scenario = [ /* граф, см. ниже */ ];
      $body = ['name' => 'Опрос', 'data' => json_encode($scenario, JSON_UNESCAPED_UNICODE)];
      ```

      В ответах (`GET /scenarios/{id}`) поле `data` приходит уже **объектом**, а не строкой —
      перед отправкой обратно в `PUT` его нужно снова сериализовать.

      ## Структура графа

      `data` — объект, где **ключ = id элемента**, значение = сам элемент. Массив не подойдёт.
      Переходы между элементами — по id.

      Обязательный скелет любого сценария:

      - ровно один элемент `start` — точка входа, его `next` ведёт в «ждём речи»;
      - ровно один `talk_detect` — «ждём, пока абонент возьмёт трубку и скажет „алло“».
        Он обязан лежать под ключом **`TALK_DETECT`**: этот id зашит в генераторе дайлплана;
      - минимум один `end` с `next: null` — в него в итоге должны приходить все ветки,
        иначе часть сценария окажется недостижимой.

      Id остальных элементов придумываете вы: **латиница, цифры, `_`, `.` и `-`, до 64 символов**
      (id становится именем экстеншена в дайлплане, поэтому набор символов ограничен). Удобнее
      всего uuid (`a1b2c3d4`), но подойдут и осмысленные — `greeting`, `menu`. Для `start` и `end`
      принято брать `START` и `END`. Поле `id` внутри элемента обязано совпадать с его ключом.

      ## Общие поля элемента

      | Поле   | Тип             | Описание |
      |--------|-----------------|----------|
      | `id`   | string          | Совпадает с ключом в объекте `data`. |
      | `type` | string          | Тип элемента (таблица ниже). |
      | `name` | string          | Название — видно в отчётах и на схеме сценария. У системных `start`/`talk_detect`/`end` можно не задавать. |
      | `next` | string \| null  | id следующего элемента. Только у линейных типов; у ветвящихся переходы лежат внутри `data`. |

      Граф собирается по переходам (`next` и ветки внутри `data`), обратные рёбра считать не нужно.
      Каждый элемент должен быть достижим из `start` — иначе 422. Поле `prev`, которое требовали
      старые версии API, теперь необязательно: если вы его присылаете, оно просто игнорируется.

      ## Типы элементов и их `data`

      **`playback` — проиграть аудиозапись.** `data` = id аудиозаписи (число/строка, ваша запись
      из `GET /sounds`), плюс `next`.
      ```json
      { "id": "greet", "type": "playback", "name": "Приветствие", "next": "menu", "data": 427760 }
      ```

      **`record` — записать речь абонента.** `data.duration` — сколько писать, 5–60 с;
      `data.silence` — пауза, после которой запись обрывается, 2–5 с. Плюс `next`.
      Запись потом слушается в детализации обзвона.
      ```json
      { "id": "rec", "type": "record", "name": "Ответ", "next": "END",
        "data": { "duration": 20, "silence": 3 } }
      ```

      **`dtmf` — проиграть аудио и ждать нажатия клавиши.** `data.id` — id аудиозаписи с вопросом;
      `data.directions[]` — ветки, где `keywords` = ровно одна цифра `0`–`9`;
      `data.timeout` — `{duration, next}`, куда идти, если абонент молчит (`duration` 5–20 с);
      `data.else.next` — куда идти при нажатии, которого нет в ветках;
      `data.reask.enabled` — переспрос (`false`, если не нужен).

      **`speech` — проиграть аудио и распознать РЕЧЬ.** Поля те же, что у `dtmf`, но
      `keywords` — список ожидаемых слов через запятую (буквы, пробелы, запятые), а `timeout.duration`
      берите 1–10 с. Дополнительно `data.question` — сам вопрос текстом: если ответ абонента не совпал
      ни с одним списком слов, вопрос и ответ уходят ИИ-классификатору, и он выбирает ветку сам.
      Заполняйте `question` — это заметно поднимает точность.
      ```json
      { "id": "ask", "type": "speech", "name": "Интересно?", "data": {
          "id": 427759,
          "question": "Интересно ли вам предложение?",
          "directions": [
            { "keywords": "да,конечно,интересно,давайте", "next": "sms1" },
            { "keywords": "нет,не надо,не интересно,отказ", "next": "END" }
          ],
          "timeout": { "duration": 7, "next": "END" },
          "else": { "next": "END" },
          "reask": { "enabled": false }
        } }
      ```
      Каждый `speech` тарифицируется отдельно (см. цену распознавания в тарифах).

      **`dial` — соединить абонента с вашим номером.** `data.number` — **id** подтверждённого номера
      (не сам номер, список — в `GET /settings/confirmed_numbers`); `data.duration` — лимит
      разговора 60–600 с;
      `data.timeout.next` — ⚠️ куда идти, если **дозвонились** (историческое название поля, не таймаут);
      `data.else.next` — если дозвониться не удалось.

      **`sms` — SMS абоненту.** `data.message` — текст, плюс `next`. Поддерживаются
      `{{переменные}}` контакта. Длина не ограничена одним сообщением: длинный текст уйдёт
      несколькими частями и так же посчитается в стоимости (70 символов кириллицей на часть,
      160 латиницей). Номер указывать не нужно — SMS всегда уходит абоненту, которому звоним.

      **`sms_me` — SMS себе.** То же самое, но `data.number` — id вашего подтверждённого номера,
      и он используется по-настоящему. К тексту автоматически добавляется номер абонента.

      **`request` — HTTP-запрос на ваш сервер.** `data.url` (обязателен, `http://` или `https://`),
      `data.method` (по умолчанию `POST`), `data.headers` — массив `{key, value}`,
      `data.bodyType` — `none` \| `json` \| `form`, `data.body` — тело для `json`,
      `data.params` — массив `{key, value}` для `form`, `data.save_var` — имя переменной
      (латиница, цифры, `_`), куда положить ответ, чтобы использовать его дальше как `{{имя}}`.
      В URL, заголовках и теле работают `{{переменные}}`.
      ```json
      { "id": "hook", "type": "request", "name": "Отдать лид в CRM", "next": "END",
        "data": { "url": "https://example.kz/api/lead", "method": "POST", "headers": [],
                  "bodyType": "json", "body": "{\"phone\":\"{{phone}}\",\"name\":\"{{name}}\"}" } }
      ```
      Запросы на приватные адреса (`10.0.0.0/8`, `127.0.0.1`, метаданные облаков) блокируются.

      ## Элементы с переменными

      Эти пять типов появились вместе с новым конструктором и работают через API наравне
      с остальными. Имена переменных — латиница, цифры и `_`; в текстах, URL и телах запросов
      они подставляются как `{{имя}}` вперемешку с переменными контакта.

      **`say` — озвучить текст (TTS).** `data.text` — что сказать, плюс `next`. Удобно, когда
      фраза зависит от данных: `«Здравствуйте, {{name}}, ваш заказ {{order}} готов»`.
      Тарифицируется по цене синтеза.

      **`stt_var` — записать ответ абонента в переменную.** `data.duration` 5–60 с,
      `data.silence` 2–5 с, `data.variable` — имя переменной, плюс `next`. В отличие от `speech`
      никакого ветвления не делает: просто кладёт распознанный текст в переменную.

      **`setvar` — задать переменную.** `data.variable`, `data.value` (до 255 символов), плюс `next`.

      **`ifelse` — условие.** `data.conditions` — массив `{variable, operator, value}`;
      `data.logic` — `AND` (по умолчанию) или `OR`, если условий несколько;
      `data.then.next` — куда идти, если условие выполнено, `data.else.next` — если нет.

      **`switchvar` — мультиветка по значению переменной.** `data.variable`, `data.operator`,
      `data.cases` — массив `{value, next}` (перебираются сверху вниз, побеждает первый
      подошедший), `data.else.next` — если ни один кейс не подошёл.

      Операторы сравнения: `===`, `!==`, `contains` (подстрока, без учёта регистра),
      `>`, `<`, `>=`, `<=` (числа сравниваются как числа, остальное — как строки).

      ```json
      {
        "ask":   { "id": "ask", "type": "stt_var", "name": "Спросить город", "next": "check",
                   "data": { "duration": 15, "silence": 3, "variable": "city" } },
        "check": { "id": "check", "type": "ifelse", "name": "Это Астана?",
                   "data": { "conditions": [ { "variable": "city", "operator": "contains", "value": "астана" } ],
                             "logic": "AND", "then": { "next": "greet" }, "else": { "next": "END" } } }
      }
      ```

      ## Пример 1 — минимальный: поздоровались и положили трубку

      ```json
      {
        "START":       { "id": "START", "type": "start", "name": "Начало", "next": "TALK_DETECT" },
        "TALK_DETECT": { "id": "TALK_DETECT", "type": "talk_detect", "name": "Ждём речи", "next": "greet" },
        "greet":       { "id": "greet", "type": "playback", "name": "Приветствие", "next": "END", "data": 427760 },
        "END":         { "id": "END", "type": "end", "name": "Конец", "next": null }
      }
      ```

      ## Пример 2 — распознавание речи: согласным шлём SMS

      ```json
      {
        "START":       { "id": "START", "type": "start", "name": "Начало", "next": "TALK_DETECT" },
        "TALK_DETECT": { "id": "TALK_DETECT", "type": "talk_detect", "name": "Ждём речи", "next": "greet" },
        "greet":       { "id": "greet", "type": "playback", "name": "Приветствие", "next": "ask", "data": 427760 },
        "ask": {
          "id": "ask", "type": "speech", "name": "Интересно предложение?", "data": {
            "id": 427759,
            "question": "Интересно ли вам наше предложение?",
            "directions": [
              { "keywords": "да,конечно,интересно,давайте,расскажите", "next": "sms1" },
              { "keywords": "нет,не надо,не интересно,некогда", "next": "END" }
            ],
            "timeout": { "duration": 7, "next": "END" },
            "else":    { "next": "END" },
            "reask":   { "enabled": false }
          }
        },
        "sms1": {
          "id": "sms1", "type": "sms", "name": "Подробности в SMS", "next": "END",
          "data": { "message": "Спасибо! Подробности: example.kz" }
        },
        "END": { "id": "END", "type": "end", "name": "Конец", "next": null }
      }
      ```
      В `END` тут приходят сразу четыре перехода: ветка «нет», таймаут и «иначе» у `ask` плюс
      `sms1`. Перечислять их где-то отдельно не нужно — граф строится по самим переходам.

      ## Пример 3 — DTMF-меню с переводом на менеджера

      ```json
      {
        "START":       { "id": "START", "type": "start", "name": "Начало", "next": "TALK_DETECT" },
        "TALK_DETECT": { "id": "TALK_DETECT", "type": "talk_detect", "name": "Ждём речи", "next": "menu" },
        "menu": {
          "id": "menu", "type": "dtmf", "name": "Меню", "data": {
            "id": 427759,
            "directions": [
              { "keywords": "1", "next": "call_manager" },
              { "keywords": "2", "next": "notify" }
            ],
            "timeout": { "duration": 10, "next": "END" },
            "else":    { "next": "END" },
            "reask":   { "enabled": false }
          }
        },
        "call_manager": {
          "id": "call_manager", "type": "dial", "name": "Соединить с менеджером", "data": { "number": 4321, "duration": 300, "timeout": { "next": "END" }, "else": { "next": "notify" } }
        },
        "notify": {
          "id": "notify", "type": "sms_me", "name": "Сообщить мне", "next": "END",
          "data": { "message": "Абонент просит перезвонить", "number": 4321 }
        },
        "END": { "id": "END", "type": "end", "name": "Конец", "next": null }
      }
      ```
      `427759`/`427760` — id ваших аудиозаписей (`GET /sounds`), `4321` — id подтверждённого номера
      (`GET /settings/confirmed_numbers`). Подставьте свои: чужие id вернут 422.

      ## Частые ошибки 422

      | Сообщение | Причина |
      |-----------|---------|
      | Значение поля data должно быть закодированной json строкой | Прислали объект вместо строки либо список вместо объекта «id → элемент». |
      | Элемент «…» имеет неверную структуру (нет type) | У элемента нет поля `type` либо вместо объекта лежит строка/число. |
      | Недопустимый тип элемента у «…» | Опечатка в `type`. |
      | Недопустимый id элемента «…» | В id есть что-то кроме латиницы, цифр, `_`, `.`, `-` либо он длиннее 64 символов. |
      | У элемента «…» поле id не совпадает с его ключом | `"a1": { "id": "a2", … }` — так нельзя. |
      | В сценарии должен быть ровно один элемент «Начало звонка» / «Ждём речи» | Нет `start`/`talk_detect` или их несколько. |
      | Элемент «Ждём речи» должен лежать под ключом TALK_DETECT | `talk_detect` положили под своим id. |
      | После «Начало звонка» должно идти «Ждём речи» | `start.next` ведёт не в `talk_detect`. |
      | В сценарии должен быть хотя бы один элемент «Положить трубку» | Нет ни одного `end`. |
      | У элемента «…» есть переход на несуществующий элемент | `next` (или `next` внутри ветки) ссылается на id, которого нет в объекте. |
      | Элемент «…» недостижим (в него не ведёт ни одна стрелка) | В элемент нет входа из `start` — забыли его подключить. |
      | Элемент «…» должен куда-то вести | Пустой `next` у линейного элемента. |
      | У «…» не указана аудиозапись / Аудиозапись у «…» вам не принадлежит | Нет `data.id` (или `data` у `playback`) либо id чужой записи. |
      | У «…» добавьте хотя бы одну ветку / ветка никуда не ведёт | Пустой `directions[]` или ветка без `next`. |
      | У «…» не задан переход по таймауту / «иначе» | Нет `data.timeout.next` или `data.else.next`. |
      | У «…» таймаут должен быть …–… секунд | `timeout.duration` вне диапазона: `dtmf` 5–20, `speech` 1–10. |
      | У «…» некорректный URL | В `request` не `http(s)://…`. |
      | У «…» имя переменной: только латиница, цифры и _ | Кириллица или пробел в `variable`/`save_var`. |

      Стоимость сценария (`max_cost`) считается сервером сам — как самая дорогая цепочка по графу,
      и возвращается в ответе.
  - name: ИИ-агенты
    description: |
      Голосовые ИИ-агенты: живой разговор с абонентом вместо жёсткого сценария.

      Агент сам ведёт диалог, отвечает на вопросы, извлекает из разговора нужные вам поля
      (`data_schema`) и может по ходу разговора отправить SMS или сходить HTTP-запросом
      на ваш сервер (`tools`).

      **Жизненный цикл:**
      1. `POST /agents` — агент создаётся со статусом `generating`;
      2. фоновый профилировщик считает его параметры (это секунды, реже — минуты);
      3. статус становится `ready` — только с ним агента можно поставить в обзвон;
      4. `POST /autocalls` с `type=agent` и `agent_id`.

      **Правка агента** (`PUT /agents/{id}`) с новым `prompt` или `max_seconds` снова переводит
      его в `generating`. Уже запущенные обзвоны это не затрагивает — они звонят по слепку,
      снятому в момент создания обзвона.
  - name: Обзвоны
    description: Создание и управление автоматическими обзвонами.
  - name: SMS рассылки
    description: Создание и управление SMS рассылками.
  - name: Настройки
    description: Управление настройками аккаунта, номерами и визитной карточкой.
  - name: Платежи
    description: Управление балансом и просмотр транзакций.
  - name: Панель мониторинга
    description: Сводная статистика и активность аккаунта.
  - name: Уведомления
    description: Получение и управление уведомлениями аккаунта.
  - name: Flash Calls
    description: |
      Верификация пользователей через звонок (Flash Call / Missed Call OTP).

      Сервис совершает звонок на номер абонента. Последние N цифр номера звонящего и являются кодом подтверждения.
      Звонок сбрасывается автоматически — биллинг на стороне абонента не возникает.

      **Два режима:**
      - **Авто-код** (`digits`) — сервис сам генерирует случайный код из N цифр. Работает всегда.
      - **Свой код** (`code`) — вы передаёте нужный код. Может вернуть 422 если нужного номера нет в пуле.

      **Rate limit:** не более 3 попыток на один номер в течение 5 минут.

paths:

  # ─────────────────────────────────────────
  # ПУБЛИЧНЫЙ API (без авторизации)
  # ─────────────────────────────────────────

  /lists:
    get:
      summary: Получить все списки контактов
      operationId: get-lists
      tags: [Списки контактов]
      description: Возвращает все списки контактов с постраничным выводом. Поддерживает фильтрацию по дате и client_id.
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/ClientIdFilter'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Объект постраничного вывода со списками контактов.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ContactList'
              example:
                current_page: 1
                data:
                  - id: 73
                    client_id: "123e4567-e89b-12d3-a456-426655440000"
                    name: "Клиенты март"
                    importing: false
                    nonexistent: null
                    created_at: "2024-03-31 05:55:19"
                    updated_at: "2024-03-31 05:55:19"
                    contacts_count: 250
                    used: 3
                first_page_url: "https://autocall.kz/api/v1/lists?page=1"
                from: 1
                last_page: 2
                last_page_url: "https://autocall.kz/api/v1/lists?page=2"
                next_page_url: "https://autocall.kz/api/v1/lists?page=2"
                path: "https://autocall.kz/api/v1/lists"
                per_page: 23
                prev_page_url: null
                to: 23
                total: 27
        '401': { $ref: '#/components/responses/401' }
        '404':
          description: Список не найден по указанному `client_id`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorMessage' }
        '422': { $ref: '#/components/responses/422' }
        '429': { $ref: '#/components/responses/429' }

    post:
      summary: Создать новый список контактов
      operationId: post-lists
      tags: [Списки контактов]
      description: |
        Создаёт новый список контактов. Максимум 10 000 номеров в одном запросе.
        Для загрузки большего количества — создайте список с первыми 10 000 контактами, затем дополните через `/lists/append/{id}`.
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      requestBody:
        required: true
        description: Параметры нового списка контактов.
        content:
          application/json:
            schema:
              type: object
              required: [name, numbers]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 40
                  description: Название списка
                numbers:
                  type: array
                  maxItems: 10000
                  description: Массив с номерами телефонов
                  items:
                    type: object
                    required: [number]
                    properties:
                      number:
                        type: string
                        minLength: 12
                        maxLength: 12
                        pattern: '^\+7(700|701|702|705|707|708|747|771|775|776|777|778|710|711|712|713|714|715|716|717|718|721|722|723|724|725|726|727|728|729|736)\d{7}$'
                        description: Номер телефона в формате +7XXXXXXXXXX
                      extra:
                        type: string
                        maxLength: 255
                        description: Дополнительное описание (ФИО, ИИН и т.п.)
                      variables:
                        type: object
                        description: |
                          Переменные для персонализации SMS. Используются в тексте рассылки через `{{varname}}`.
                          Ключи — только `[a-zA-Z0-9_]`, до 30 символов. Значения — строки до 255 символов.
                        additionalProperties: { type: string }
                        example: { name: "Иванов Иван", debt: "15000" }
                client_id:
                  type: string
                  maxLength: 256
                  description: ID в Вашей системе
            examples:
              Простой список:
                value:
                  name: "Клиенты апрель"
                  numbers:
                    - number: "+77010000001"
                    - number: "+77010000002"
              С описанием и client_id:
                value:
                  name: "VIP клиенты"
                  client_id: "vip-2024"
                  numbers:
                    - number: "+77010000001"
                      extra: "Иванов И.И."
                    - number: "+77010000002"
                      extra: "Петров П.П."
              С переменными:
                value:
                  name: "Должники май"
                  numbers:
                    - number: "+77010000001"
                      extra: "Иванов Иван"
                      variables:
                        name: "Иван"
                        debt: "15000"
                        contract: "№А-123"
                    - number: "+77010000002"
                      extra: "Петров Пётр"
                      variables:
                        name: "Пётр"
                        debt: "3200"
                        contract: "№Б-456"
      responses:
        '201':
          description: Список успешно создан.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactList'
              example:
                id: 74
                name: "Клиенты апрель"
                client_id: "vip-2024"
                contacts_count: 2
                created_at: "2024-04-11 22:14:09"
                updated_at: "2024-04-11 22:14:09"
        '401': { $ref: '#/components/responses/401' }
        '422': { $ref: '#/components/responses/422' }
        '429': { $ref: '#/components/responses/429' }
        '500': { $ref: '#/components/responses/500' }

  /lists/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
        description: ID списка
    get:
      summary: Показать список
      operationId: get-lists-id
      tags: [Списки контактов]
      description: Возвращает детальную информацию о списке с контактами (постраничный вывод).
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Объект списка с контактами.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ContactList'
                  - type: object
                    properties:
                      contacts:
                        allOf:
                          - $ref: '#/components/schemas/Pagination'
                          - type: object
                            properties:
                              data:
                                type: array
                                items:
                                  $ref: '#/components/schemas/Contact'
        '401': { $ref: '#/components/responses/401' }
        '404': { $ref: '#/components/responses/404' }
        '429': { $ref: '#/components/responses/429' }
    put:
      summary: Редактировать список
      operationId: put-lists-id
      tags: [Списки контактов]
      description: Изменяет название или client_id списка контактов.
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 40
                client_id:
                  type: string
                  maxLength: 256
      responses:
        '200':
          description: Обновлённый объект списка.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactList' }
        '401': { $ref: '#/components/responses/401' }
        '404': { $ref: '#/components/responses/404' }
        '422': { $ref: '#/components/responses/422' }
        '429': { $ref: '#/components/responses/429' }
        '500': { $ref: '#/components/responses/500' }
    delete:
      summary: Удалить список
      operationId: delete-lists-id
      tags: [Списки контактов]
      description: Удаляет список контактов и все контакты в нём.
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      responses:
        '204':
          description: Список удалён.
        '401': { $ref: '#/components/responses/401' }
        '404': { $ref: '#/components/responses/404' }
        '422': { $ref: '#/components/responses/422' }
        '429': { $ref: '#/components/responses/429' }
        '500': { $ref: '#/components/responses/500' }

  /lists/append/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
        description: ID списка, который нужно дополнить
    post:
      summary: Дополнить список контактов
      operationId: post-lists-append-id
      tags: [Списки контактов]
      description: Добавляет номера в уже существующий список контактов.
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [numbers]
              properties:
                numbers:
                  type: array
                  maxItems: 10000
                  items:
                    type: object
                    required: [number]
                    properties:
                      number:
                        type: string
                        minLength: 12
                        maxLength: 12
                        pattern: '^\+7(700|701|702|705|707|708|747|771|775|776|777|778|710|711|712|713|714|715|716|717|718|721|722|723|724|725|726|727|728|729|736)\d{7}$'
                      extra:
                        type: string
                        maxLength: 255
                      variables:
                        type: object
                        description: Переменные для персонализации SMS. Ключи — `[a-zA-Z0-9_]`.
                        additionalProperties: { type: string }
      responses:
        '201':
          description: Список успешно дополнен.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  client_id: { type: [string, "null"] }
                  contacts_count: { type: integer }
                  created_at: { type: string }
                  updated_at: { type: string }
        '401': { $ref: '#/components/responses/401' }
        '404': { $ref: '#/components/responses/404' }
        '422': { $ref: '#/components/responses/422' }
        '429': { $ref: '#/components/responses/429' }

  /lists/nonexistent/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
        description: ID списка
    delete:
      summary: Удалить несуществующие номера из списка
      operationId: delete-lists-nonexistent-id
      tags: [Списки контактов]
      description: |
        Удаляет из списка номера, которые оператор пометил как несуществующие в ходе обзвонов.
        Несуществующие номера появляются в поле `nonexistent` после завершения обзвона.
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      responses:
        '204':
          description: Несуществующие номера удалены.
        '401': { $ref: '#/components/responses/401' }
        '404': { $ref: '#/components/responses/404' }
        '429': { $ref: '#/components/responses/429' }
        '500': { $ref: '#/components/responses/500' }
    put:
      summary: Проигнорировать несуществующие номера
      operationId: put-lists-nonexistent-id
      tags: [Списки контактов]
      description: Сбрасывает флаг несуществующих номеров в списке без их удаления.
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
      responses:
        '200':
          description: Флаг сброшен, возвращается обновлённый объект списка.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactList' }
        '401': { $ref: '#/components/responses/401' }
        '404': { $ref: '#/components/responses/404' }
        '429': { $ref: '#/components/responses/429' }
        '500': { $ref: '#/components/responses/500' }

