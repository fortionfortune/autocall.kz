        '200':
          description: Объект с балансом.
          content:
            application/json:
              schema:
                type: object
                required: [balance, currency]
                properties:
                  balance:
                    type: number
                    description: Остаток на балансе
                  currency:
                    type: string
                    description: Символ валюты
              example:
                balance: 1450.75
                currency: "₸"
        '401': { $ref: '#/components/responses/401' }
        '429': { $ref: '#/components/responses/429' }

  /payments:
    get:
      summary: Получить транзакции
      operationId: get-payments
      tags: [Платежи]
      description: Возвращает полную информацию о балансе и историю транзакций с постраничным выводом.
      parameters:
        - $ref: '#/components/parameters/ContentType'
        - $ref: '#/components/parameters/Accept'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Объект с данными баланса и транзакциями.
          content:
            application/json:
              schema:
                type: object
                required: [balance, currency, reserved, incoming, outgoing, paid, used, transactions]
                properties:
                  balance: { type: number }
                  currency: { type: string }
                  reserved: { type: number, description: Замороженная сумма }
                  incoming: { type: number, description: Обороты по приходу }
                  outgoing: { type: number, description: Обороты по расходу }
                  paid: { type: number, description: Всего пополнено }
                  used: { type: number, description: Всего израсходовано }
                  transactions:
                    allOf:
                      - $ref: '#/components/schemas/Pagination'
